  // Sede se deriva de la Campaña (Arándano→Piscu · Uva/Granada→Ica)
  function refreshNiSede(){
    const campanaId = document.getElementById('niCampana').value;
    const sedeId = CAMPANA_SEDE[campanaId];
    const sedeNombre = DB.sedes.find(s=>s.id===sedeId)?.nombre || sedeId;
    document.getElementById('niSede').innerHTML = `<option value="${sedeId}" selected>${sedeNombre}</option>`;
  }
  refreshNiSede();
  document.getElementById('niCampana').addEventListener('change', refreshNiSede);

  // Selects con opción "+ Agregar nuevo..." para Naviera / Operador / Depósito
  function refreshEntitySelect(selectId, nombres, addLabel, presetValue){
    const sel = document.getElementById(selectId);
    const prevValue = presetValue ?? sel.value;
    sel.innerHTML = nombres.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('') +
      `<option value="__nuevo__">+ ${addLabel}</option>`;
    if(nombres.includes(prevValue)) sel.value = prevValue;
  }
  refreshEntitySelect('niNaviera', nombresUnicos('naviera'), 'Agregar nueva naviera', editRecord?.naviera);
  refreshEntitySelect('niOperador', nombresUnicos('operador'), 'Agregar nuevo operador', editRecord?.operador);
  refreshEntitySelect('niDeposito', nombresUnicos('deposito'), 'Agregar nuevo depósito', editRecord?.deposito);

  document.getElementById('niNaviera').addEventListener('change', function(){
    if(this.value === '__nuevo__') openAddEntityModal('naviera', (nombre)=>{
      refreshEntitySelect('niNaviera', nombresUnicos('naviera'), 'Agregar nueva naviera');
      document.getElementById('niNaviera').value = nombre;
    }, ()=> refreshEntitySelect('niNaviera', nombresUnicos('naviera'), 'Agregar nueva naviera'));
  });
  document.getElementById('niOperador').addEventListener('change', function(){
    if(this.value === '__nuevo__') openAddEntityModal('operador logístico', (nombre)=>{
      refreshEntitySelect('niOperador', nombresUnicos('operador'), 'Agregar nuevo operador');
      document.getElementById('niOperador').value = nombre;
    }, ()=> refreshEntitySelect('niOperador', nombresUnicos('operador'), 'Agregar nuevo operador'));
  });
  document.getElementById('niDeposito').addEventListener('change', function(){
    if(this.value === '__nuevo__') openAddEntityModal('depósito', (nombre)=>{
      refreshEntitySelect('niDeposito', nombresUnicos('deposito'), 'Agregar nuevo depósito');
      document.getElementById('niDeposito').value = nombre;
    }, ()=> refreshEntitySelect('niDeposito', nombresUnicos('deposito'), 'Agregar nuevo depósito'));
  });

  // Tipo de hallazgo: permite agregar uno nuevo sin salir del formulario
  function refreshHallazgoSelect(presetValue){
    const sel = document.getElementById('niHallazgoTipo');
    const prevValue = presetValue ?? sel.value;
    sel.innerHTML = `<option value="">Sin hallazgo</option>` +
      DB.hallazgosCatalog.map(h=>`<option value="${escapeHtml(h.label)}">${escapeHtml(h.label)}</option>`).join('') +
      `<option value="__nuevo__">+ Agregar nuevo hallazgo</option>`;
    sel.value = prevValue || '';
  }
  document.getElementById('niHallazgoTipo').addEventListener('change', function(){
    if(this.value === '__nuevo__') openAddEntityModal('hallazgo', (nombre)=>{
      refreshHallazgoSelect(nombre);
    }, ()=> refreshHallazgoSelect(editRecord?.hallazgo||''));
  });

  // Adjuntos
  function renderAttachChips(){
    const row = document.getElementById('niAttachRow');
    const chips = [];
    NuevaInspeccionState.adjuntos.forEach((a,i)=> chips.push(`<span class="attach-chip">${icon('camera')}<span data-ver-adj="${i}" style="text-decoration:underline; cursor:pointer;">${escapeHtml(a.nombre)}</span><button data-remove-adj="${i}">${icon('x')}</button></span>`));
    if(NuevaInspeccionState.eir){
      const eirData = NuevaInspeccionState.eir;
      const contenido = eirData.dataUrl
        ? `<span data-ver-eir="1" style="text-decoration:underline; cursor:pointer;">${escapeHtml(eirData.nombre)}</span>`
        : escapeHtml(eirData.nombre);
      chips.push(`<span class="attach-chip">${icon('clipboardCheck')}${contenido}<button data-remove-eir="1">${icon('x')}</button></span>`);
    }
    row.innerHTML = chips.join('');
    row.querySelectorAll('[data-ver-adj]').forEach(el=> el.addEventListener('click', ()=>{
      const a = NuevaInspeccionState.adjuntos[+el.dataset.verAdj];
      if(a) openLightbox(a.dataUrl, a.nombre);
    }));
    const verEir = row.querySelector('[data-ver-eir]');
    if(verEir) verEir.addEventListener('click', ()=> abrirAdjunto(NuevaInspeccionState.eir.dataUrl));
    row.querySelectorAll('[data-remove-adj]').forEach(b=> b.addEventListener('click', (e)=>{
      e.stopPropagation();
      NuevaInspeccionState.adjuntos.splice(+b.dataset.removeAdj,1); renderAttachChips();
    }));
    const eirBtn = row.querySelector('[data-remove-eir]');
    if(eirBtn) eirBtn.addEventListener('click', (e)=>{ e.stopPropagation(); NuevaInspeccionState.eir = null; renderAttachChips(); });
  }
  renderAttachChips();
  document.getElementById('btnAdjEvidencia').addEventListener('click', ()=> document.getElementById('niFileEvidencia').click());
  document.getElementById('niFileEvidencia').addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files || []);
    for(const file of files){
      const dataUrl = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); });
      NuevaInspeccionState.adjuntos.push({nombre:file.name, dataUrl});
    }
    e.target.value='';
    renderAttachChips();
  });
  document.getElementById('btnAdjEir').addEventListener('click', ()=> document.getElementById('niFileEir').click());
  document.getElementById('niFileEir').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(file){
      const dataUrl = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); });
      NuevaInspeccionState.eir = { nombre:file.name, dataUrl };
      renderAttachChips();
    }
    e.target.value='';
  });

  document.getElementById('btnCancelarInsp').addEventListener('click', ()=>{
    State.editingInspeccionId = null;
    location.hash = '#/inspecciones';
  });

  document.getElementById('btnGuardarInsp').addEventListener('click', async ()=>{
    const contenedor = document.getElementById('niContenedor').value.trim();
    if(!contenedor){ toast('Ingresa el N.° de contenedor', 'alert'); return; }
    if(!document.getElementById('niResultado').value){ toast('Selecciona el resultado de la inspección', 'alert'); return; }
    const campana = document.getElementById('niCampana').value;
    const externa = Array.from(root.querySelectorAll('#niExterna input:checked')).map(i=>i.value);
    const interna = Array.from(root.querySelectorAll('#niInterna input:checked')).map(i=>i.value);
    const hallazgoTipo = document.getElementById('niHallazgoTipo').value || null;

    const payload = {
      contenedor,
      fecha: document.getElementById('niFecha').value,
      campana,
      sede: CAMPANA_SEDE[campana],
      naviera: document.getElementById('niNaviera').value,
      booking: document.getElementById('niBooking').value,
      operador: document.getElementById('niOperador').value,
      deposito: document.getElementById('niDeposito').value,
      inspector: document.getElementById('niInspector').value || 'Luis Rodríguez',
      resultado: document.getElementById('niResultado').value,
      hallazgo: hallazgoTipo,
      descripcion: document.getElementById('niDescripcion').value,
      checklistExterna: externa,
      checklistInterna: interna,
      eir: NuevaInspeccionState.eir ? (NuevaInspeccionState.eir.dataUrl || NuevaInspeccionState.eir.nombre) : null,
    };

    if(editRecord){
      await DataService.updateInspeccion(editRecord.id, payload);
    } else {
      await DataService.createInspeccion(payload);
    }

    // Las evidencias adjuntas (nuevas) quedan disponibles en la vista Evidencias
    for(const adj of NuevaInspeccionState.adjuntos){
      await DataService.addEvidencia({
        id: Date.now()+Math.random(), titulo:`Contenedor ${contenedor}`,
        tipo: hallazgoTipo || 'Inspección', fecha: document.getElementById('niFecha').value, img: adj.dataUrl,
      });
    }

    toast(esPendiente ? 'Inspección completada correctamente' : editRecord ? 'Inspección actualizada correctamente' : 'Inspección registrada correctamente');
    State.editingInspeccionId = null;
    location.hash = '#/inspecciones';
  });
}

// Modal genérico de confirmación (usado para eliminar registros).
// Convierte un data-URL (base64) en un Blob real.
function dataURLaBlob(dataUrl){
  const [meta, base64] = dataUrl.split(',');
  const mime = (meta.match(/:(.*?);/)||[])[1] || 'application/octet-stream';
  const bin = atob(base64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
// Abre un adjunto (foto o EIR) en una pestaña nueva de forma confiable.
// Los navegadores modernos bloquean o fallan al navegar directo a un "data:" URL muy
// largo (por eso el EIR se veía en blanco); convertirlo primero a un Blob lo soluciona.
function abrirAdjunto(dataUrl){
  if(!dataUrl) return;
  if(dataUrl.startsWith('data:')){
    const url = URL.createObjectURL(dataURLaBlob(dataUrl));
    window.open(url, '_blank');
    setTimeout(()=> URL.revokeObjectURL(url), 60000);
  } else {
    window.open(dataUrl, '_blank');
  }
}

  document.getElementById('btnGenerar').addEventListener('click', async ()=>{
    const filtros = {
      campana: document.getElementById('repCampana').value,
      sede: document.getElementById('repSede').value,
      resultado: document.getElementById('repResultado').value,
    };
    currentRows = await DataService.getInspecciones(filtros);
    const conforme = currentRows.filter(r=>r.resultado==='conforme').length;
    const observado = currentRows.filter(r=>r.resultado==='observado').length;
    const rechazado = currentRows.filter(r=>r.resultado==='rechazado').length;
    const pendiente = currentRows.filter(r=>!r.resultado).length;
    const despachado = conforme + observado; // todo lo que se despacha (rechazado no se despacha)
    const total = currentRows.length || 1;
    document.getElementById('repResumen').innerHTML = `
      <div class="grid" style="grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:16px;">
        <div style="background:#f8f8fc;border-radius:12px;padding:14px;"><div class="kpi-label">Total registros</div><div class="kpi-value" style="font-size:20px;">${total}</div></div>
        <div style="background:var(--info-light);border-radius:12px;padding:14px;"><div class="kpi-label">Despachado</div><div class="kpi-value" style="font-size:20px;color:var(--info);">${despachado} <span style="font-size:12px;">(${(despachado/total*100).toFixed(0)}%)</span></div></div>
        <div style="background:#f0f1f7;border-radius:12px;padding:14px;"><div class="kpi-label">Pendiente</div><div class="kpi-value" style="font-size:20px;color:var(--text-muted);">${pendiente} <span style="font-size:12px;">(${(pendiente/total*100).toFixed(0)}%)</span></div></div>
        <div style="background:var(--success-light);border-radius:12px;padding:14px;"><div class="kpi-label">Conforme</div><div class="kpi-value" style="font-size:20px;color:var(--success);">${conforme} <span style="font-size:12px;">(${(conforme/total*100).toFixed(0)}%)</span></div></div>
        <div style="background:var(--warning-light);border-radius:12px;padding:14px;"><div class="kpi-label">Observado</div><div class="kpi-value" style="font-size:20px;color:var(--warning);">${observado} <span style="font-size:12px;">(${(observado/total*100).toFixed(0)}%)</span></div></div>
        <div style="background:var(--danger-light);border-radius:12px;padding:14px;"><div class="kpi-label">Rechazado</div><div class="kpi-value" style="font-size:20px;color:var(--danger);">${rechazado} <span style="font-size:12px;">(${(rechazado/total*100).toFixed(0)}%)</span></div></div>
      </div>
      <div style="font-size:12px; color:var(--text-muted);">Reporte generado el ${fmt.datetime(new Date())} — ${fmt.num(total)} contenedores incluidos.</div>
    `;
    toast('Reporte generado');
  });

  document.getElementById('btnExportar').addEventListener('click', ()=>{
    const rows = currentRows.length ? currentRows : DB.inspecciones;
    const header = ['Contenedor','Fecha','Campaña','Sede','Operador','Depósito','Naviera','Booking','Resultado','Hallazgo','Inspector'];
    const csvRows = rows.map(r=>[r.contenedor, r.fecha, r.campana, r.sede, r.operador, r.deposito, r.naviera, r.booking||'', r.resultado||'pendiente', r.hallazgo||'', r.inspector||'']);
    const csv = [header, ...csvRows].map(row => row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `reporte_inspecciones_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Archivo CSV exportado');
  });
}

/* =====================================================================================
   VISTA: EVIDENCIAS  (galería + carga funcional de archivos)
   ===================================================================================== */
async function renderEvidencias(root){
  root.innerHTML = `
    <div class="view-header">
      <div><h2>Evidencias</h2><p>Fotografías y documentos asociados a inspecciones</p></div>
      <button class="btn btn-primary" id="btnSubirEvidencia">${icon('upload')} Subir evidencia</button>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none;" />
    </div>
    <div class="card card-pad">
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  `;

  async function refresh(){
    const items = await DataService.getEvidencias();
    const grid = document.getElementById('galleryGrid');
    if(!items.length){
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">${icon('image')}<h4>Sin evidencias aún</h4><p>Sube fotografías de inspecciones para verlas aquí.</p></div>`;
      return;
    }
    grid.innerHTML = items.map(e=>`
      <div class="gallery-tile">
        <div class="gallery-thumb" data-ver-foto="${e.id}" style="cursor:${e.img?'pointer':'default'}; background:${e.img?`center/cover no-repeat url('${e.img}')`: `linear-gradient(135deg, ${e.color}, ${e.color}cc)`};">
          ${e.img ? '' : icon('image')}
        </div>
        <div class="gallery-meta">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:6px;">
            <div style="min-width:0;"><b style="display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(e.titulo)}</b><span>${escapeHtml(e.tipo)} · ${fmt.fecha(e.fecha)}</span></div>
          </div>
          <div style="display:flex; gap:6px; margin-top:8px;">
            <button class="icon-action-btn" data-edit-ev="${e.id}" title="Editar" style="width:26px;height:26px;">${icon('edit')}</button>
            ${Sesion.puedeEliminar() ? `<button class="icon-action-btn danger" data-delete-ev="${e.id}" title="Eliminar" style="width:26px;height:26px;">${icon('trash')}</button>` : ''}
          </div>
        </div>
      </div>
    `).join('');

    grid.querySelectorAll('[data-ver-foto]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const ev = items.find(i=>String(i.id)===el.dataset.verFoto);
        if(ev && ev.img) openLightbox(ev.img, ev.titulo);
      });
    });
    grid.querySelectorAll('[data-edit-ev]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const ev = items.find(i=>String(i.id)===btn.dataset.editEv);
        openEditarEvidenciaModal(ev, refresh);
      });
    });
    grid.querySelectorAll('[data-delete-ev]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.deleteEv;
        const ev = items.find(i=>String(i.id)===id);
        openConfirmModal({
          title:'Eliminar evidencia',
          message:`¿Seguro que deseas eliminar "${ev?.titulo||'esta evidencia'}"? Esta acción no se puede deshacer.`,
          confirmLabel:'Eliminar',
        }, async ()=>{
          await DataService.deleteEvidencia(id);
          toast('Evidencia eliminada');
          refresh();
        });
      });
    });
  }

  document.getElementById('btnSubirEvidencia').addEventListener('click', ()=> document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files || []);
    for(const file of files){
      const dataUrl = await new Promise(res=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.readAsDataURL(file); });
      await DataService.addEvidencia({ id: Date.now()+Math.random(), titulo:file.name.replace(/\.[^.]+$/,''), tipo:'Carga manual', fecha:new Date().toISOString().slice(0,10), img:dataUrl });
    }
    toast(`${files.length} evidencia(s) agregada(s)`);
    e.target.value = '';
    refresh();
  });

  await refresh();
}

    <div class="card card-pad">

// Modal para crear/editar un usuario del sistema.
function openUsuarioModal(user, onSaved){
  const isEdit = !!user;
  const roles = ['Administrador','Supervisor','Inspector'];
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" style="max-width:420px;">
        <div class="modal-head"><h3>${isEdit?'Editar usuario':'Nuevo usuario'}</h3><button class="modal-close" id="modalClose">${icon('x')}</button></div>
        <div class="modal-body">
          <div class="form-row"><label>Nombre completo</label><input type="text" id="userNombre" placeholder="Ej. Diego Fernández" value="${user?escapeHtml(user.nombre):''}" /></div>
          <div class="form-row"><label>Correo</label><input type="email" id="userCorreo" placeholder="nombre@seguridadpatrimonial.pe" value="${user?escapeHtml(user.correo):''}" /></div>
          <div class="form-row"><label>Rol</label>
            <select id="userRol" class="select-inline">
              ${roles.map(r=>`<option value="${r}" ${user&&user.rol===r?'selected':''}>${r}</option>`).join('')}
            </select>
          </div>
          ${isEdit ? `
          <div class="config-row" style="padding:10px 0 0;">
            <div class="config-row-text"><b>Usuario activo</b><span>Desactivar revoca su acceso sin eliminar el registro</span></div>
            <label class="switch"><input type="checkbox" id="userActivo" ${user.activo?'checked':''}/><span class="switch-track"></span></label>
          </div>` : `
          <div class="form-row"><label>Contraseña temporal</label><input type="text" id="userPassword" placeholder="Mínimo 6 caracteres" /></div>
          <p style="font-size:11.8px; color:var(--text-muted); margin-top:2px;">Compártele esta contraseña por un canal seguro; puede cambiarla después desde su cuenta.</p>`}
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="modalCancel">Cancelar</button>
          <button class="btn btn-primary" id="modalGuardarUsuario">${icon('check')} ${isEdit?'Guardar cambios':'Crear usuario'}</button>
        </div>
      </div>
    </div>
  `;
  const close = ()=> modalRoot.innerHTML = '';
  document.getElementById('modalClose').addEventListener('click', close);
  document.getElementById('modalCancel').addEventListener('click', close);
  document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') close(); });
  document.getElementById('modalGuardarUsuario').addEventListener('click', async ()=>{
    const nombre = document.getElementById('userNombre').value.trim();
    // Se limpian espacios (incluidos los invisibles que se cuelan al copiar y pegar)
    // y se valida el formato antes de enviar, para dar el aviso al instante.
    const correo = document.getElementById('userCorreo').value.replace(/[\s\u00A0\u200B-\u200D\uFEFF]/g, '').toLowerCase();
    if(!nombre || !correo){ toast('Completa nombre y correo', 'alert'); return; }
    if(!/^[^@\s]+@[^@\s.]+(\.[^@\s.]+)+$/.test(correo)){
      toast('El correo no tiene un formato válido (ej. nombre@vanguardfresh.pe)', 'alert'); return;
    }
    const data = { nombre, correo, rol: document.getElementById('userRol').value };
    const btn = document.getElementById('modalGuardarUsuario');
    try{
      if(isEdit){
        data.activo = document.getElementById('userActivo').checked;
        btn.disabled = true; btn.textContent = 'Guardando...';
        await DataService.updateUsuario(user.id, data);
        toast('Usuario actualizado correctamente');
      } else {
        const password = document.getElementById('userPassword').value;
        if(!password || password.length < 6){ toast('La contraseña debe tener al menos 6 caracteres', 'alert'); return; }
        data.password = password;
        btn.disabled = true; btn.textContent = 'Creando...';
        await DataService.createUsuario(data);
        toast('Usuario creado correctamente');
      }
      close();
      onSaved();
    } catch(err){
      toast('Error: '+(err.message||'no se pudo completar la operación'), 'alert');
      btn.disabled = false; btn.textContent = isEdit?'Guardar cambios':'Crear usuario';
    }
  });
}

/* =====================================================================================
   MODO CAMPO (móvil) — vista dedicada para inspectores en el patio
   ---------------------------------------------------------------------------------------

const CampoState = { tab:'pendientes', busqueda:'', fotos:[], eir:null };

// Reutiliza la misma imagen del logo que ya está en el sidebar (evita duplicar el base64).
const LOGO_VANGUARD = (document.getElementById('logoVanguard')||{}).src || '';

function esPantallaMovil(){ return window.innerWidth <= 820; }

function activarModoCampo(activo){
  document.body.classList.toggle('modo-campo', activo);
  localStorage.setItem('modoCampo', activo ? '1' : '0');
}

// Vista 1: lista de contenedores (pendientes / inspeccionados hoy)
async function renderCampoLista(root){
  const rows = DB.inspecciones;
  const hoy = new Date().toISOString().slice(0,10);
  const pendientes = rows.filter(r=>!r.resultado);
  const hechosHoy = rows.filter(r=> r.resultado && r.fecha === hoy);
  const lista = (CampoState.tab === 'pendientes' ? pendientes : hechosHoy)
    .filter(r=>{
      const q = CampoState.busqueda.trim().toLowerCase();
      if(!q) return true;
      return r.contenedor.toLowerCase().includes(q) || (r.booking||'').toLowerCase().includes(q);
    });

  root.innerHTML = `
    <div class="campo-header">
      <div class="logo"><img src="${LOGO_VANGUARD}" alt="Vanguard" /></div>
      <div class="campo-header-text">
        <b>Inspección en campo</b>
        <span>${escapeHtml(DB.configuracion.nombre||'')}</span>
      </div>
      <button id="campoSalir" title="Ver panel completo">${icon('bar')} Panel</button>
    </div>
    <div class="campo-body">
      <div class="campo-search">
        ${icon('search')}
        <input type="text" id="campoBuscar" placeholder="Buscar contenedor o booking..." value="${escapeHtml(CampoState.busqueda)}" />
      </div>
      <div class="campo-tabs">
        <button data-tab="pendientes" class="${CampoState.tab==='pendientes'?'active':''}">
          <span class="badge">${pendientes.length}</span>Pendientes
        </button>
        <button data-tab="hoy" class="${CampoState.tab==='hoy'?'active':''}">
          <span class="badge">${hechosHoy.length}</span>Inspeccionados hoy
        </button>
      </div>
      <div id="campoLista"></div>
      <button class="campo-btn secundario" id="campoNuevo" style="margin-top:14px;">${icon('plus')} Registrar contenedor nuevo</button>
    </div>
  `;

  const cont = document.getElementById('campoLista');
  if(!lista.length){
    cont.innerHTML = `<div class="campo-empty">${icon('clipboardCheck')}
      <h4>${CampoState.tab==='pendientes'?'Sin pendientes':'Nada inspeccionado hoy'}</h4>
      <p>${CampoState.tab==='pendientes'?'No hay contenedores esperando inspección.':'Las inspecciones que registres hoy aparecerán aquí.'}</p></div>`;
  } else {
    const pill = (r)=> r==='conforme' ? '<span class="pill pill-green">Conforme</span>'
                    : r==='observado' ? '<span class="pill pill-amber">Observado</span>'
                    : r==='rechazado' ? '<span class="pill pill-red">Rechazado</span>'
                    : '<span class="pill pill-gray">Pendiente</span>';
    cont.innerHTML = lista.map(r=>`
      <div class="campo-card">
        <div class="campo-card-top">
          <div class="campo-card-cont">${escapeHtml(r.contenedor)}</div>
          ${pill(r.resultado)}
        </div>
        <div class="campo-card-meta">
          <b>${escapeHtml(DB.campanas.find(c=>c.id===r.campana)?.nombre||'')}</b> · ${escapeHtml(r.naviera||'—')}<br/>
          Booking: ${escapeHtml(r.booking||'—')} · ${escapeHtml(r.deposito||'—')}
        </div>
        <button class="campo-btn ${r.resultado?'secundario':''}" data-insp="${r.id}">
          ${icon(r.resultado?'eye':'clipboardCheck')} ${r.resultado?'Ver / editar':'Inspeccionar'}
        </button>
      </div>
    `).join('');
    cont.querySelectorAll('[data-insp]').forEach(b=> b.addEventListener('click', ()=>{
      State.editingInspeccionId = +b.dataset.insp;
      location.hash = '#/campo-inspeccion';
    }));
  }

  document.getElementById('campoBuscar').addEventListener('input', debounce((e)=>{
    CampoState.busqueda = e.target.value;
    renderCampoLista(root);
  }, 250));
  root.querySelectorAll('[data-tab]').forEach(b=> b.addEventListener('click', ()=>{
    CampoState.tab = b.dataset.tab; renderCampoLista(root);
  }));
  document.getElementById('campoNuevo').addEventListener('click', ()=>{
    State.editingInspeccionId = null;
    location.hash = '#/campo-inspeccion';
  });
  document.getElementById('campoSalir').addEventListener('click', ()=>{
    activarModoCampo(false);
    location.hash = '#/inicio';
  });
}

// Vista 2: formulario de inspección optimizado para el dedo
async function renderCampoInspeccion(root){
  CampoState.fotos = [];
  CampoState.eir = null;
  const rec = State.editingInspeccionId ? DB.inspecciones.find(i=>i.id===State.editingInspeccionId) : null;
  let resultadoSel = rec?.resultado || '';

  root.innerHTML = `
    <div class="campo-header">
      <button id="campoVolver" title="Volver">${icon('x')}</button>
      <div class="campo-header-text">
        <b>${rec ? escapeHtml(rec.contenedor) : 'Nuevo contenedor'}</b>
        <span>${rec ? (rec.resultado?'Editar inspección':'Pendiente de inspección') : 'Registro en campo'}</span>
      </div>
    </div>
    <div class="campo-body">
      ${!rec ? `
      <div class="campo-form-section">
        <h3>Datos del contenedor</h3>
        <div class="campo-field"><label>N.° contenedor</label><input type="text" id="cpContenedor" placeholder="MSCU1234567" autocapitalize="characters" /></div>
        <div class="campo-field"><label>Campaña</label><select id="cpCampana">${DB.campanas.map(c=>`<option value="${c.id}">${escapeHtml(c.nombre)}</option>`).join('')}</select></div>
        <div class="campo-field"><label>Fecha</label><input type="date" id="cpFecha" value="${new Date().toISOString().slice(0,10)}" /></div>
        <div class="campo-field"><label>Naviera</label><input type="text" id="cpNaviera" list="dlNavieras" placeholder="Escribe o elige" /><datalist id="dlNavieras">${nombresUnicos('naviera').map(n=>`<option value="${escapeHtml(n)}">`).join('')}</datalist></div>
        <div class="campo-field"><label>Booking</label><input type="text" id="cpBooking" placeholder="BK-00000" /></div>
        <div class="campo-field"><label>Operador logístico</label><input type="text" id="cpOperador" list="dlOperadores" placeholder="Escribe o elige" /><datalist id="dlOperadores">${nombresUnicos('operador').map(n=>`<option value="${escapeHtml(n)}">`).join('')}</datalist></div>
        <div class="campo-field"><label>Depósito</label><input type="text" id="cpDeposito" list="dlDepositos" placeholder="Escribe o elige" /><datalist id="dlDepositos">${nombresUnicos('deposito').map(n=>`<option value="${escapeHtml(n)}">`).join('')}</datalist></div>
      </div>` : ''}

      <div class="campo-form-section">
        <h3>Inspección externa</h3>
        ${CHECK_EXTERNA.map(c=>`
          <label class="campo-check ${rec?.checklistExterna?.includes(c.id)?'checked':''}">
            <input type="checkbox" data-ext="${c.id}" ${rec?.checklistExterna?.includes(c.id)?'checked':''} />${c.label}
          </label>`).join('')}
      </div>

      <div class="campo-form-section">
        <h3>Inspección interna</h3>
        ${CHECK_INTERNA.map(c=>`
          <label class="campo-check ${rec?.checklistInterna?.includes(c.id)?'checked':''}">
            <input type="checkbox" data-int="${c.id}" ${rec?.checklistInterna?.includes(c.id)?'checked':''} />${c.label}
          </label>`).join('')}
      </div>

      <div class="campo-form-section">
        <h3>Resultado</h3>
        <div class="campo-resultado" id="cpResultado">
          <button type="button" data-res="conforme" class="${resultadoSel==='conforme'?'sel-conforme':''}">Conforme</button>
          <button type="button" data-res="observado" class="${resultadoSel==='observado'?'sel-observado':''}">Observado</button>
          <button type="button" data-res="rechazado" class="${resultadoSel==='rechazado'?'sel-rechazado':''}">Rechazado</button>
        </div>
        <div class="campo-field" style="margin-top:14px;"><label>Tipo de hallazgo</label>
          <select id="cpHallazgo">
            <option value="">Sin hallazgo</option>
            ${DB.hallazgosCatalog.map(h=>`<option value="${escapeHtml(h.label)}" ${rec?.hallazgo===h.label?'selected':''}>${escapeHtml(h.label)}</option>`).join('')}
          </select>
        </div>
        <div class="campo-field"><label>Descripción</label>
          <textarea id="cpDescripcion" rows="3" placeholder="Describa el hallazgo y la acción tomada...">${rec?.descripcion?escapeHtml(rec.descripcion):''}</textarea>
        </div>
      </div>

      <div class="campo-form-section">
        <h3>Evidencias</h3>
        <button class="campo-btn secundario" id="cpTomarFoto">${icon('camera')} Tomar foto</button>
        <input type="file" id="cpFileFoto" accept="image/*" capture="environment" multiple style="display:none;" />
        <button class="campo-btn secundario" id="cpAdjEir" style="margin-top:8px;">${icon('clipboardCheck')} Adjuntar EIR</button>
        <input type="file" id="cpFileEir" style="display:none;" />
        <div class="campo-foto-grid" id="cpFotoGrid"></div>
      </div>
    </div>

    <div class="campo-guardar-bar">
      <button class="campo-btn" id="cpGuardar">${icon('check')} ${rec && rec.resultado ? 'Guardar cambios' : 'Guardar inspección'}</button>
    </div>
  `;

  // Checklists: marcar visualmente al tocar
  root.querySelectorAll('.campo-check').forEach(l=>{
    const cb = l.querySelector('input');
    cb.addEventListener('change', ()=> l.classList.toggle('checked', cb.checked));
  });

  // Selector de resultado (botones grandes)
  const clases = {conforme:'sel-conforme', observado:'sel-observado', rechazado:'sel-rechazado'};
  root.querySelectorAll('#cpResultado button').forEach(b=>{
    b.addEventListener('click', ()=>{
      resultadoSel = b.dataset.res;
      root.querySelectorAll('#cpResultado button').forEach(x=>{
        x.className = x.dataset.res===resultadoSel ? clases[resultadoSel] : '';
      });
    });
  });

  // Fotos
  function pintarFotos(){
    document.getElementById('cpFotoGrid').innerHTML = CampoState.fotos.map((f,i)=>`
      <div class="campo-foto-tile"><img src="${f.dataUrl}" /><button data-del-foto="${i}">${icon('x')}</button></div>
    `).join('') + (CampoState.eir ? `<div class="campo-foto-tile" style="display:flex;align-items:center;justify-content:center;background:var(--primary-light);color:var(--primary);flex-direction:column;gap:4px;font-size:10px;font-weight:700;">${icon('clipboardCheck')}EIR<button data-del-eir="1">${icon('x')}</button></div>` : '');
    document.querySelectorAll('[data-del-foto]').forEach(b=> b.addEventListener('click', ()=>{
      CampoState.fotos.splice(+b.dataset.delFoto,1); pintarFotos();
    }));
    const de = document.querySelector('[data-del-eir]');
    if(de) de.addEventListener('click', ()=>{ CampoState.eir=null; pintarFotos(); });
  }
  document.getElementById('cpTomarFoto').addEventListener('click', ()=> document.getElementById('cpFileFoto').click());
  document.getElementById('cpFileFoto').addEventListener('change', async (e)=>{
    for(const file of Array.from(e.target.files||[])){
      const dataUrl = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); });
      CampoState.fotos.push({nombre:file.name, dataUrl});
    }
    e.target.value=''; pintarFotos();
  });
  document.getElementById('cpAdjEir').addEventListener('click', ()=> document.getElementById('cpFileEir').click());
  document.getElementById('cpFileEir').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(file){
      const dataUrl = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); });
      CampoState.eir = {nombre:file.name, dataUrl};
      pintarFotos();
    }
    e.target.value='';
  });
  pintarFotos();

  document.getElementById('campoVolver').addEventListener('click', ()=>{
    State.editingInspeccionId = null;
    location.hash = '#/campo';
  });

  // Guardar
  document.getElementById('cpGuardar').addEventListener('click', async ()=>{
    const btn = document.getElementById('cpGuardar');
    if(!resultadoSel){ toast('Selecciona el resultado de la inspección', 'alert'); return; }

    const externa = Array.from(root.querySelectorAll('[data-ext]:checked')).map(i=>i.dataset.ext);
    const interna = Array.from(root.querySelectorAll('[data-int]:checked')).map(i=>i.dataset.int);
    const hallazgo = document.getElementById('cpHallazgo').value || null;
    const descripcion = document.getElementById('cpDescripcion').value;
    const eirVal = CampoState.eir ? CampoState.eir.dataUrl : (rec?.eir || null);

    let contenedorNombre, payload;
    if(rec){
      contenedorNombre = rec.contenedor;
      payload = { ...rec, resultado:resultadoSel, hallazgo, descripcion,
        checklistExterna:externa, checklistInterna:interna, eir:eirVal,
        inspector: DB.configuracion.nombre };
    } else {
      contenedorNombre = document.getElementById('cpContenedor').value.trim().toUpperCase();
      if(!contenedorNombre){ toast('Ingresa el N.° de contenedor', 'alert'); return; }
      const campana = document.getElementById('cpCampana').value;
      payload = {
        contenedor: contenedorNombre,
        fecha: document.getElementById('cpFecha').value,
        campana, sede: CAMPANA_SEDE[campana],
        naviera: document.getElementById('cpNaviera').value.trim(),
        booking: document.getElementById('cpBooking').value.trim(),
        operador: document.getElementById('cpOperador').value.trim(),
        deposito: document.getElementById('cpDeposito').value.trim(),
        inspector: DB.configuracion.nombre,
        resultado:resultadoSel, hallazgo, descripcion,
        checklistExterna:externa, checklistInterna:interna, eir:eirVal,
      };
    }

    btn.disabled = true; btn.textContent = 'Guardando...';
    try{
      if(rec) await DataService.updateInspeccion(rec.id, payload);
      else await DataService.createInspeccion(payload);

      for(const f of CampoState.fotos){
        await DataService.addEvidencia({
          titulo:`Contenedor ${contenedorNombre}`, tipo: hallazgo || 'Inspección',
          fecha: payload.fecha, img: f.dataUrl,
        });
      }
      toast('Inspección guardada');
      State.editingInspeccionId = null;
      location.hash = '#/campo';
    } catch(err){
      btn.disabled = false;
      btn.innerHTML = `${icon('check')} Guardar inspección`;
    }
  });
}

/* =====================================================================================
   LOGIN REAL (Supabase Auth)
   ===================================================================================== */
async function verificarSesion(){
  const { data: { session } } = await supabase.auth.getSession();
  if(!session){ mostrarPantallaLogin(); return false; }
  const { data: perfil } = await supabase.from('perfiles').select('*').eq('id', session.user.id).maybeSingle();

  // Un usuario desactivado no puede seguir usando el sistema aunque su login sea válido.
  if(perfil && perfil.activo === false){
    await supabase.auth.signOut();
    mostrarPantallaLogin('Tu cuenta está desactivada. Contacta a un administrador.');
    return false;
  }

  const nombre = perfil ? perfil.nombre : session.user.email.split('@')[0];
  DB.configuracion.nombre = nombre;
  DB.configuracion.correo = perfil ? perfil.correo : session.user.email;
  // Rol del usuario logueado — controla qué acciones se muestran en la interfaz.
  Sesion.userId = session.user.id;
  Sesion.rol = perfil ? perfil.rol : 'Inspector';

  // Si el login es válido pero no existe su fila en 'perfiles', las políticas de
  // seguridad (que dependen del rol) bloquearán la lectura de datos y todo aparecerá
  // vacío. Se avisa explícitamente para no confundirlo con "no hay datos".
  if(!perfil){
    const aviso = document.createElement('div');
    aviso.style.cssText = 'position:fixed; top:0; left:0; right:0; z-index:9999; background:#f5a524; color:#3a2a05; padding:10px 16px; font:600 12.5px Inter,-apple-system,sans-serif; text-align:center;';
    aviso.textContent = `Tu usuario (${session.user.email}) no tiene un perfil registrado, por eso no se muestran datos. Un administrador debe crear tu fila en la tabla "perfiles" con tu rol.`;
    document.body.prepend(aviso);
  }

  // Refleja quién inició sesión en el sidebar ("Inspector activo")
  const nombreEl = document.getElementById('inspectorName');
  const avatarEl = document.getElementById('inspectorAvatar');
  if(nombreEl) nombreEl.textContent = nombre;
  if(avatarEl){
    const iniciales = nombre.trim().split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase();
    avatarEl.textContent = iniciales || '?';
  }
  const rolEl = document.getElementById('inspectorRol');
  if(rolEl) rolEl.textContent = Sesion.rol;
  return true;
}

function mostrarPantallaLogin(){
  document.body.innerHTML = `
    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f4f5fa; font-family:'Inter',-apple-system,sans-serif;">
      <form id="loginForm" style="background:#fff; padding:32px; border-radius:16px; width:320px; box-shadow:0 8px 30px rgba(0,0,0,.1);">
        <h2 style="margin:0 0 4px; font-size:19px; color:#1c1f36;">Seguridad Contenedores</h2>
        <p style="margin:0 0 20px; font-size:12.5px; color:#8a8fa3;">Inicia sesión para continuar</p>
        <input id="loginEmail" type="email" placeholder="Correo" required autocomplete="username"
          style="width:100%; padding:10px 12px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px; font-size:14px; box-sizing:border-box;" />
        <input id="loginPass" type="password" placeholder="Contraseña" required autocomplete="current-password"
          style="width:100%; padding:10px 12px; margin-bottom:14px; border:1px solid #ddd; border-radius:8px; font-size:14px; box-sizing:border-box;" />
        <button type="submit" style="width:100%; padding:11px; background:#6c5ce7; color:#fff; border:none; border-radius:8px; font-weight:700; font-size:14px; cursor:pointer;">Entrar</button>
        <p id="loginError" style="color:#ef5350; font-size:12.5px; margin:10px 0 0; min-height:16px;"></p>
      </form>
    </div>`;
  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    document.getElementById('loginError').textContent = '';
    const { error } = await supabase.auth.signInWithPassword({
      email: document.getElementById('loginEmail').value,
      password: document.getElementById('loginPass').value,
    });
    if(error){ document.getElementById('loginError').textContent = 'Correo o contraseña incorrectos.'; return; }
    location.reload();
  });
}

verificarSesion().then(ok => { if(ok) cargarDatosDesdeSupabase().then(()=>{
  const disponibles = getPeriodosDisponibles();

}); });
