<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seguridad Contenedores — Panel Ejecutivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* =====================================================================
   DESIGN TOKENS
   ===================================================================== */
:root{
  --bg-app:#f4f5fa;
  --bg-sidebar:#0e1130;
  --bg-sidebar-2:#151a3e;
  --sidebar-active:rgba(124,108,240,.20);
  --text-sidebar:#a4a9c4;
  --text-sidebar-active:#ffffff;

  --primary:#6c5ce7;
  --primary-dark:#5645c9;
  --primary-light:#eeebfd;

  --success:#1fb980;
  --success-light:#e2f8ef;

  --warning:#f5a524;
  --warning-light:#fef3e0;

  --danger:#ef5350;
  --danger-light:#fde9e8;

  --info:#3b82f6;
  --info-light:#e8f0fe;

  --granada:#f2994a;
  --granada-light:#fdf0e4;

  --rust:#c2622d;
  --rust-light:#f6e6dc;

  --text-heading:#1c1f36;
  --text-body:#454a63;
  --text-muted:#8a8fa3;

  --border:#ececf4;
  --card-bg:#ffffff;

  --radius-lg:18px;
  --radius-md:14px;
  --radius-sm:9px;

  --shadow-card:0 2px 14px rgba(24,26,58,.06);
  --shadow-pop:0 12px 32px rgba(24,26,58,.16);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg-app);
  color:var(--text-body);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;color:var(--text-heading);}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;text-decoration:none;}
ul{list-style:none;margin:0;padding:0;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#d6d8e6;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* =====================================================================
   LAYOUT
   ===================================================================== */
.app-shell{display:flex; min-height:100vh; width:100%;}

.sidebar{
  width:246px; flex-shrink:0;
  background:linear-gradient(180deg,var(--bg-sidebar) 0%, var(--bg-sidebar-2) 100%);
  display:flex; flex-direction:column;
  padding:22px 14px 18px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  z-index:40;
}
.brand{display:flex; align-items:center; gap:11px; padding:0 8px 22px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:14px;}
.brand-icon{
  width:42px; height:42px; border-radius:11px; flex-shrink:0;
  background:#ffffff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.18);
  padding:5px;
}
.brand-icon img{width:100%; height:100%; object-fit:contain;}
.brand-text h1{font-size:14.5px; font-weight:700; color:#fff; line-height:1.25;}
.brand-text span{font-size:11px; color:#8388ab; font-weight:500;}

.nav-section{margin-top:6px;}
.nav-list{display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:10px 12px; border-radius:10px;
  color:var(--text-sidebar); font-size:13.5px; font-weight:500;
  cursor:pointer; position:relative; border:none; background:none; width:100%; text-align:left;
  transition:background .15s ease, color .15s ease;
}
.nav-item svg{width:17px;height:17px; stroke:currentColor; flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.05); color:#e3e5f4;}
.nav-item.active{background:var(--sidebar-active); color:var(--text-sidebar-active);}
.nav-item.active::before{
  content:""; position:absolute; left:-14px; top:8px; bottom:8px; width:3px;
  border-radius:0 4px 4px 0; background:var(--primary);
}

.sidebar-footer{margin-top:auto; display:flex; flex-direction:column; gap:10px; padding-top:14px;}
.mini-card{
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
  border-radius:var(--radius-sm); padding:11px 12px;
}
.mini-card-label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:#767ca0; font-weight:600; margin-bottom:7px;}
.mini-card-row{display:flex; align-items:center; gap:9px;}
.avatar{
  width:30px;height:30px;border-radius:50%; background:linear-gradient(135deg,var(--primary),#8b7cf6);
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:11.5px; font-weight:700; flex-shrink:0;
}
.mini-card-name{color:#fff; font-size:12.8px; font-weight:600;}
.status-dot{width:6px;height:6px;border-radius:50%; background:var(--success); display:inline-block; margin-right:5px; box-shadow:0 0 0 3px rgba(31,185,128,.18);}
.mini-card-sub{font-size:11px; color:#9296b8; margin-top:2px;}
.campaign-icon{width:30px;height:30px;border-radius:8px; background:rgba(108,92,231,.25); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.campaign-icon svg{width:15px;height:15px; stroke:#b7aefb;}

.main{flex:1; min-width:0; padding:22px 26px 48px;}

.sidebar-toggle{
  display:none; position:fixed; top:14px; left:14px; z-index:60;
  width:38px;height:38px; border-radius:10px; border:none; background:var(--bg-sidebar);
  color:#fff; align-items:center; justify-content:center; box-shadow:var(--shadow-pop); cursor:pointer;
}
.sidebar-toggle svg{width:19px;height:19px;stroke:currentColor;}
.sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(10,10,25,.45); z-index:39;}

/* =====================================================================
   SHARED UI
   ===================================================================== */
.view-header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
.view-header h2{font-size:21px; font-weight:800;}
.view-header p{font-size:13px; color:var(--text-muted); margin-top:4px;}
.btn{
  display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600;
  padding:10px 16px; border-radius:10px; border:none; cursor:pointer; transition:filter .15s, transform .05s;
}
.btn svg{width:15px;height:15px;stroke:currentColor;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary); color:#fff; box-shadow:0 6px 14px rgba(108,92,231,.32);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:#fff; color:var(--text-body); border:1px solid var(--border);}
.btn-ghost:hover{background:#f7f7fb;}

.card{background:var(--card-bg); border-radius:var(--radius-lg); box-shadow:var(--shadow-card); border:1px solid #f1f1f7;}
.card-pad{padding:20px 22px;}
.card-title-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.card-title-row h3{font-size:15px; font-weight:700;}

.grid{display:grid; gap:18px;}

/* filters (top select-like controls) */
.filters-row{display:flex; gap:22px; flex-wrap:wrap;}
.filter-group{display:flex; flex-direction:column; gap:5px;}
.filter-group label{font-size:10.5px; font-weight:700; letter-spacing:.06em; color:var(--text-muted); text-transform:uppercase;}
.select-wrap{position:relative;}
.select-wrap select{
  appearance:none; -webkit-appearance:none;
  background:#fff; border:1px solid var(--border); border-radius:10px;
  font-size:13.5px; font-weight:700; color:var(--text-heading);
  padding:8px 30px 8px 10px; cursor:pointer; min-width:132px;
}
.select-wrap::after{
  content:""; position:absolute; right:10px; top:50%; width:8px; height:8px;
  border-right:2px solid var(--text-muted); border-bottom:2px solid var(--text-muted);
  transform:translateY(-65%) rotate(45deg); pointer-events:none;
}

/* icon badges */
.icon-badge{width:42px;height:42px;border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.icon-badge svg{width:20px;height:20px; stroke-width:2;}
.badge-purple{background:var(--primary-light); color:var(--primary);}
.badge-blue{background:var(--info-light); color:var(--info);}
.badge-amber{background:var(--warning-light); color:var(--warning);}
.badge-red{background:var(--danger-light); color:var(--danger);}
.badge-green{background:var(--success-light); color:var(--success);}

/* status pill */
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px;}
.pill-green{background:var(--success-light); color:var(--success);}
.pill-amber{background:var(--warning-light); color:var(--warning);}
.pill-red{background:var(--danger-light); color:var(--danger);}
.pill-gray{background:#f0f1f7; color:var(--text-muted);}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}

/* tables */
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted);
  font-weight:700; padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap;
}
tbody td{padding:12px 14px; border-bottom:1px solid #f4f4fa; color:var(--text-body); white-space:nowrap;}
tbody tr:hover{background:#faf9ff;}
tbody tr:last-child td{border-bottom:none;}
.cell-strong{color:var(--text-heading); font-weight:600;}
.icon-action-btn{
  width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:#fff; color:var(--text-muted);
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:background .15s, color .15s, border-color .15s;
}
.icon-action-btn svg{width:14px;height:14px;}
.icon-action-btn:hover{background:var(--primary-light); color:var(--primary); border-color:var(--primary-light);}
.icon-action-btn.danger:hover{background:var(--danger-light); color:var(--danger); border-color:var(--danger-light);}

/* toolbar (search+filter for table views) */
.toolbar{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
.search-box{position:relative; flex:1; min-width:220px; max-width:340px;}
.search-box svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px;height:15px; stroke:var(--text-muted);}
.search-box input{
  width:100%; padding:10px 12px 10px 34px; border-radius:10px; border:1px solid var(--border);
  font-size:13px; background:#fff; color:var(--text-heading);
}
.search-box input:focus, select:focus{outline:2px solid var(--primary-light); border-color:var(--primary);}
.toolbar .select-wrap select{min-width:150px; font-weight:600; font-size:13px;}

/* empty state */
.empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:48px 20px; color:var(--text-muted);}
.empty-state svg{width:44px;height:44px; stroke:#c9cce2; margin-bottom:12px;}
.empty-state h4{font-size:14.5px; color:var(--text-heading); margin-bottom:5px;}
.empty-state p{font-size:12.8px; max-width:320px;}

/* toast */
.toast-container{position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:10px; z-index:200;}
.toast{
  background:#1c1f36; color:#fff; padding:12px 16px; border-radius:10px; font-size:13px; font-weight:500;
  box-shadow:var(--shadow-pop); display:flex; align-items:center; gap:9px; min-width:220px;
  animation:toast-in .25s ease;
}
.toast svg{width:16px;height:16px; stroke:var(--success); flex-shrink:0;}
@keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(15,17,38,.5); display:flex; align-items:center; justify-content:center; z-index:150; padding:20px;}
.modal{background:#fff; border-radius:var(--radius-lg); width:100%; max-width:520px; box-shadow:var(--shadow-pop); max-height:88vh; overflow-y:auto;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px; font-weight:800;}
.modal-close{background:none; border:none; cursor:pointer; color:var(--text-muted); padding:4px;}
.modal-close svg{width:18px;height:18px; stroke:currentColor;}
.modal-body{padding:20px 22px;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border);}
.form-row{margin-bottom:14px; display:flex; flex-direction:column; gap:6px;}
.form-row label{font-size:12.5px; font-weight:700; color:var(--text-heading);}
.form-row input, .form-row select, .form-row textarea{
  padding:10px 12px; border-radius:10px; border:1px solid var(--border); font-size:13.5px; font-family:inherit; color:var(--text-heading);
}
.form-grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

/* progress bar */
.progress-track{height:8px; background:#eeeef7; border-radius:99px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--primary),#8b7cf6); border-radius:99px; transition:width .5s ease;}

/* ranked list */
.rank-item{display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid #f4f4fa;}
.rank-item:last-child{border-bottom:none;}
.rank-num{width:22px;height:22px;border-radius:7px; background:#f2f2f9; color:var(--text-muted); font-size:11.5px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.rank-name{flex:1; font-size:13.2px; font-weight:600; color:var(--text-heading);}
.rank-badge{font-size:11.5px; font-weight:800; padding:4px 9px; border-radius:8px; background:var(--warning-light); color:var(--warning); white-space:nowrap;}

/* findings list */
.finding-row{display:flex; align-items:center; gap:11px; padding:9px 0; border-bottom:1px solid #f4f4fa;}
.finding-row:last-child{border-bottom:none;}
.finding-icon{width:26px;height:26px; border-radius:7px; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.finding-icon svg{width:13px;height:13px;}
.finding-label{flex:1; font-size:13px; color:var(--text-body); font-weight:500;}
.finding-count{font-size:13px; font-weight:800; color:var(--text-heading);}

/* hero banner */
.hero-row{display:flex; gap:18px; margin-bottom:18px; align-items:stretch; flex-wrap:wrap;}
.hero-card{
  flex:2 1 480px; border-radius:var(--radius-lg); padding:22px 24px; position:relative; overflow:hidden;
  background:linear-gradient(120deg,#ffffff 40%, #f4f2fe 100%);
  border:1px solid #f1f1f7; box-shadow:var(--shadow-card); display:flex; justify-content:space-between; gap:18px;
}
.hero-left h2{font-size:20px; font-weight:800;}
.hero-left > p{font-size:12.8px; color:var(--text-muted); margin-top:4px; margin-bottom:18px;}
.hero-visual{position:relative; width:230px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.hero-bars{position:absolute; inset:0; display:flex; align-items:flex-end; gap:6px; opacity:.35; padding:6px;}
.hero-bars span{flex:1; border-radius:4px 4px 0 0;}
.hero-bars span.bar-a{background:var(--primary);}
.hero-bars span.bar-u{background:var(--success);}
.hero-donut-wrap{position:relative; width:120px; height:120px; z-index:2;}
.hero-donut-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.hero-donut-center b{font-size:19px; color:var(--text-heading); font-weight:800; line-height:1;}
.hero-donut-center span{font-size:9.5px; color:var(--text-muted); font-weight:600; text-align:center; margin-top:3px; line-height:1.2;}
.hero-legend{z-index:2; display:flex; flex-direction:column; gap:9px; justify-content:center; margin-left:14px;}
.hero-legend-item{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--text-body);}
.hero-legend-item .dot{width:8px;height:8px;border-radius:50%;}
.hero-legend-item b{color:var(--text-heading); margin-left:2px;}
.hero-legend-item small{color:var(--text-muted); font-weight:600;}

.hero-kpi-card{flex:1 1 220px; border-radius:var(--radius-lg); padding:18px 20px; background:#fff; border:1px solid #f1f1f7; box-shadow:var(--shadow-card); display:flex; flex-direction:column; justify-content:center; gap:14px;}
.hero-kpi-item{display:flex; align-items:center; gap:12px;}
.hero-kpi-icon{width:34px;height:34px;border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.hero-kpi-icon svg{width:16px;height:16px;}
.hero-kpi-text{flex:1;}
.hero-kpi-text b{font-size:13px; color:var(--text-heading); font-weight:700; display:block;}
.hero-kpi-right{text-align:right;}
.hero-kpi-right b{display:block; font-size:14px; color:var(--text-heading); font-weight:800;}
.hero-kpi-right span{font-size:10.8px; color:var(--text-muted); font-weight:700;}

/* kpi cards */
.kpi-value{font-size:24px; font-weight:800; color:var(--text-heading); margin-top:10px;}
.kpi-label{font-size:12.5px; color:var(--text-muted); font-weight:600;}
.kpi-sub{font-size:11.5px; font-weight:700; margin-top:5px;}
.kpi-sub.up{color:var(--success);}
.kpi-sub.flat{color:var(--text-muted);}
.kpi-card{display:flex; flex-direction:column;}
.kpi-card .icon-badge{margin-bottom:2px;}

/* gallery (evidencias) */
.gallery-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;}
.gallery-tile{border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border); background:#fff; cursor:pointer; transition:transform .15s;}
.gallery-tile:hover{transform:translateY(-2px); box-shadow:var(--shadow-card);}
.gallery-thumb{height:110px; display:flex; align-items:center; justify-content:center; position:relative;}
.gallery-thumb img{width:100%;height:100%;object-fit:cover;}
.gallery-thumb svg{width:26px;height:26px; stroke:#fff; opacity:.85;}
.gallery-meta{padding:9px 11px;}
.gallery-meta b{display:block; font-size:12px; color:var(--text-heading);}
.gallery-meta span{font-size:10.8px; color:var(--text-muted);}

/* toggle switch */
.switch{position:relative; width:42px; height:24px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch-track{position:absolute; inset:0; background:#e2e3ee; border-radius:99px; cursor:pointer; transition:.2s;}
.switch-track::before{content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch input:checked + .switch-track{background:var(--primary);}
.switch input:checked + .switch-track::before{transform:translateX(18px);}
.config-row{display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid #f4f4fa;}
.config-row:last-child{border-bottom:none;}
.config-row-text b{display:block; font-size:13.3px; color:var(--text-heading); font-weight:700;}
.config-row-text span{font-size:12px; color:var(--text-muted);}

.footer-note{display:flex; justify-content:space-between; align-items:center; margin-top:22px; padding-top:16px; border-top:1px solid var(--border); font-size:12px; color:var(--text-muted); flex-wrap:wrap; gap:8px;}
.footer-note .dot-note::before{content:"•"; margin-right:6px; color:var(--primary);}

.chart-legend{display:flex; gap:16px; align-items:center; flex-wrap:wrap;}
.chart-legend-item{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--text-body);}
.chart-legend-item .dot{width:8px;height:8px;border-radius:50%;}
.chip-static{font-size:11.5px; font-weight:700; color:var(--text-muted); background:#f4f4fa; padding:6px 12px; border-radius:99px; display:inline-flex; align-items:center; gap:6px;}
.chip-static svg{width:12px;height:12px;}

/* =====================================================================
   HERO 2.0 — foto + filtros tipo pill + campana/notificaciones
   ===================================================================== */
.hero-card-v2{
  flex:1 1 100%; border-radius:var(--radius-lg); position:relative; overflow:hidden;
  border:1px solid #f1f1f7; box-shadow:var(--shadow-card); min-height:230px;
  display:flex; background:#fff;
}
.hero-info-panel{
  flex:0 1 480px; max-width:62%; padding:22px 24px; display:flex; flex-direction:column; justify-content:center; gap:16px;
  position:relative; z-index:2;
}
.hero-photo-wrap{
  position:absolute; inset:0; z-index:1;
}
.hero-photo-wrap svg{ width:100%; height:100%; display:block; }
.hero-topbar-icons{position:absolute; top:16px; right:18px; z-index:3; display:flex; align-items:center; gap:10px;}
.icon-btn-round{
  width:38px; height:38px; border-radius:50%; background:#fff; border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; box-shadow:var(--shadow-card);
  color:var(--text-body);
}
.icon-btn-round svg{width:17px;height:17px;}
.icon-btn-round .badge-dot{
  position:absolute; top:-3px; right:-3px; background:var(--danger); color:#fff; font-size:10px; font-weight:800;
  width:17px; height:17px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #fff;
}
.avatar-btn{
  width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--primary),#8b7cf6); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; cursor:pointer; box-shadow:var(--shadow-card);
  border:2px solid #fff;
}
.notif-dropdown{
  position:absolute; top:46px; right:0; width:280px; background:#fff; border-radius:var(--radius-md);
  box-shadow:var(--shadow-pop); border:1px solid var(--border); z-index:10; overflow:hidden;
}
.notif-dropdown-head{padding:12px 14px; font-size:12.5px; font-weight:800; color:var(--text-heading); border-bottom:1px solid var(--border);}
.notif-item{display:flex; gap:10px; padding:10px 14px; border-bottom:1px solid #f4f4fa; align-items:flex-start;}
.notif-item:last-child{border-bottom:none;}
.notif-item .dot-status{width:7px;height:7px;border-radius:50%; margin-top:5px; flex-shrink:0;}
.notif-item b{display:block; font-size:12.5px; color:var(--text-heading); font-weight:700;}
.notif-item span{font-size:11.3px; color:var(--text-muted);}
.notif-empty{padding:18px 14px; text-align:center; font-size:12.5px; color:var(--text-muted);}

.pill-filters-row{display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
.pill-filter{
  display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border);
  border-radius:99px; padding:7px 16px 7px 10px; box-shadow:0 1px 4px rgba(24,26,58,.05);
}
.pill-filter-icon{
  width:28px; height:28px; border-radius:50%; background:var(--primary-light); color:var(--primary);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.pill-filter-icon svg{width:14px;height:14px;}
.pill-filter-text{display:flex; flex-direction:column; line-height:1.15;}
.pill-filter-text label{font-size:9.5px; font-weight:700; letter-spacing:.05em; color:var(--text-muted); text-transform:uppercase;}
.pill-filter-text select{
  appearance:none; -webkit-appearance:none; border:none; background:transparent; padding:0 16px 0 0; font-size:13px;
  font-weight:800; color:var(--text-heading); cursor:pointer;
}
.pill-filter-text{position:relative;}
.pill-filter-text::after{
  content:""; position:absolute; right:0; bottom:3px; width:6px; height:6px;
  border-right:2px solid var(--text-muted); border-bottom:2px solid var(--text-muted); transform:rotate(45deg); pointer-events:none;
}

.view-toggle{display:inline-flex; background:#f0f1f7; border-radius:99px; padding:3px; gap:2px;}
.view-toggle button{
  border:none; background:none; padding:7px 14px; border-radius:99px; font-size:12px; font-weight:700; color:var(--text-muted); cursor:pointer;
}
.view-toggle button.active{background:#fff; color:var(--primary); box-shadow:0 1px 4px rgba(24,26,58,.12);}

/* Galería "imagen representativa" — hallazgos ilustrados */
.finding-tile{
  border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border); background:#fff; cursor:pointer;
  transition:transform .15s; display:flex; flex-direction:column;
}
.finding-tile:hover{transform:translateY(-2px); box-shadow:var(--shadow-card);}
.finding-tile-visual{height:64px; display:flex; align-items:center; justify-content:center;}
.finding-tile-visual svg{width:24px;height:24px; stroke:#fff;}
.finding-tile-label{padding:7px 9px; font-size:10.8px; font-weight:700; color:var(--text-heading); text-align:center; line-height:1.25;}

/* Checklist de inspección (formulario Nueva inspección) */
.check-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
.check-item{
  display:flex; align-items:center; gap:9px; border:1px solid var(--border); border-radius:10px; padding:9px 11px;
  font-size:12.8px; font-weight:600; color:var(--text-body); cursor:pointer; transition:border-color .15s, background .15s;
}
.check-item:hover{border-color:var(--primary-light); background:#faf9ff;}
.check-item input{width:15px; height:15px; accent-color:var(--primary); flex-shrink:0;}
.check-item.checked{border-color:var(--primary); background:var(--primary-light); color:var(--primary-dark);}

.diagram-box{
  margin-top:14px; background:#f4f5fb; border-radius:12px; padding:16px; display:flex; align-items:center; justify-content:center;
}
.diagram-box svg{max-width:100%;}
.diagram-caption{font-size:10.5px; font-weight:800; letter-spacing:.04em; color:var(--text-muted); text-align:center; margin-top:8px;}

.attach-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
.attach-chip{
  display:inline-flex; align-items:center; gap:6px; background:#f4f4fa; border-radius:8px; padding:5px 10px; font-size:11.8px;
  font-weight:600; color:var(--text-body);
}
.attach-chip button{border:none; background:none; cursor:pointer; color:var(--text-muted); display:flex; padding:0;}
.attach-chip button svg{width:11px;height:11px;}

.select-inline{
  border:1px solid var(--border); border-radius:10px; padding:10px 30px 10px 12px; font-size:13.5px; font-family:inherit;
  color:var(--text-heading); appearance:none; -webkit-appearance:none; width:100%; cursor:pointer; background:#fff;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a8fa3' stroke-width='2.5' stroke-linecap='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat; background-position:right 10px center; background-size:13px;
}
.select-inline:disabled{background-color:#f7f7fb; color:var(--text-muted); cursor:not-allowed; background-image:none;}

/* Atribución de cliente en el pie del sidebar */
.sidebar-client{
  margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,.08); text-align:center;
}
.sidebar-client-label{font-size:9.5px; color:#5c6188; font-weight:600; letter-spacing:.02em; text-transform:uppercase; display:block; margin-bottom:8px;}
.sidebar-client-logo-chip{background:#fff; border-radius:10px; padding:8px 10px; display:inline-flex; align-items:center; justify-content:center;}
.sidebar-client-logo-chip img{max-width:150px; width:100%; height:auto; display:block;}

/* =====================================================================
   MODO CAMPO (móvil) — vista dedicada para inspectores en el patio.
   Botones grandes, alto contraste y foco en una sola tarea a la vez.
   ===================================================================== */
body.modo-campo .app-shell{display:block;}
body.modo-campo .sidebar, body.modo-campo .sidebar-toggle, body.modo-campo .sidebar-backdrop{display:none !important;}
body.modo-campo .main{padding:0; min-height:100vh; background:var(--bg-app);}

.campo-header{
  background:linear-gradient(135deg,var(--bg-sidebar),var(--bg-sidebar-2));
  padding:14px 16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:50;
}
.campo-header .logo{width:34px;height:34px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px;flex-shrink:0;}
.campo-header .logo img{width:100%;height:100%;object-fit:contain;}
.campo-header-text{flex:1; min-width:0;}
.campo-header-text b{display:block;color:#fff;font-size:14px;font-weight:700;line-height:1.2;}
.campo-header-text span{font-size:11.5px;color:#9296b8;}
.campo-header button{
  background:rgba(255,255,255,.12); border:none; color:#fff; border-radius:9px; padding:8px 10px;
  font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:5px; flex-shrink:0;
}
.campo-header button svg{width:15px;height:15px;stroke:currentColor;}

.campo-body{padding:14px 14px 90px;}
.campo-search{position:relative; margin-bottom:12px;}
.campo-search svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px;height:18px; stroke:var(--text-muted);}
.campo-search input{
  width:100%; padding:15px 14px 15px 42px; border-radius:12px; border:1px solid var(--border);
  font-size:16px; background:#fff; color:var(--text-heading); box-sizing:border-box;
}
.campo-tabs{display:flex; gap:8px; margin-bottom:14px;}
.campo-tabs button{
  flex:1; padding:12px 8px; border-radius:11px; border:1px solid var(--border); background:#fff;
  font-size:13px; font-weight:700; color:var(--text-muted); cursor:pointer;
}
.campo-tabs button.active{background:var(--primary); color:#fff; border-color:var(--primary);}
.campo-tabs .badge{display:block; font-size:17px; margin-bottom:1px;}

.campo-card{
  background:#fff; border-radius:14px; border:1px solid var(--border); padding:14px;
  margin-bottom:10px; box-shadow:var(--shadow-card);
}
.campo-card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:8px;}
.campo-card-cont{font-size:17px; font-weight:800; color:var(--text-heading); letter-spacing:.02em;}
.campo-card-meta{font-size:12.5px; color:var(--text-muted); line-height:1.5;}
.campo-card-meta b{color:var(--text-body); font-weight:600;}
.campo-btn{
  width:100%; margin-top:12px; padding:15px; border-radius:12px; border:none; background:var(--primary);
  color:#fff; font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
}
.campo-btn svg{width:18px;height:18px;stroke:currentColor;}
.campo-btn.secundario{background:#fff; color:var(--primary); border:1.5px solid var(--primary);}

/* Formulario de inspección en campo */
.campo-form-section{background:#fff; border-radius:14px; border:1px solid var(--border); padding:16px; margin-bottom:12px;}
.campo-form-section h3{font-size:14px; font-weight:800; margin-bottom:12px;}
.campo-check{
  display:flex; align-items:center; gap:12px; padding:14px 12px; border-radius:11px;
  border:1.5px solid var(--border); margin-bottom:8px; font-size:14.5px; font-weight:600;
  color:var(--text-body); cursor:pointer; user-select:none;
}
.campo-check input{width:22px;height:22px; accent-color:var(--primary); flex-shrink:0;}
.campo-check.checked{border-color:var(--primary); background:var(--primary-light); color:var(--primary-dark);}
.campo-resultado{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
.campo-resultado button{
  padding:16px 6px; border-radius:12px; border:2px solid var(--border); background:#fff;
  font-size:13px; font-weight:800; color:var(--text-muted); cursor:pointer;
}
.campo-resultado button.sel-conforme{background:var(--success); border-color:var(--success); color:#fff;}
.campo-resultado button.sel-observado{background:var(--warning); border-color:var(--warning); color:#fff;}
.campo-resultado button.sel-rechazado{background:var(--danger); border-color:var(--danger); color:#fff;}
.campo-field{margin-bottom:12px;}
.campo-field label{display:block; font-size:12.5px; font-weight:700; color:var(--text-heading); margin-bottom:6px;}
.campo-field input, .campo-field select, .campo-field textarea{
  width:100%; padding:14px 12px; border-radius:11px; border:1px solid var(--border);
  font-size:16px; font-family:inherit; color:var(--text-heading); box-sizing:border-box; background:#fff;
}
.campo-foto-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
.campo-foto-tile{position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; border:1px solid var(--border);}
.campo-foto-tile img{width:100%;height:100%;object-fit:cover; display:block;}
.campo-foto-tile button{
  position:absolute; top:4px; right:4px; width:24px;height:24px; border-radius:50%; border:none;
  background:rgba(0,0,0,.6); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.campo-foto-tile button svg{width:12px;height:12px;stroke:currentColor;}

.campo-guardar-bar{
  position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom)); display:flex; gap:10px; z-index:60;
}
.campo-guardar-bar .campo-btn{margin-top:0;}
.campo-empty{text-align:center; padding:50px 20px; color:var(--text-muted);}
.campo-empty svg{width:48px;height:48px;stroke:#c9cce2;margin-bottom:12px;}
.campo-empty h4{font-size:15px;color:var(--text-heading);margin-bottom:6px;}
.campo-empty p{font-size:13px;}

/* =====================================================================
   RESPONSIVE
   ===================================================================== */
@media (max-width:1180px){
  .grid-5{grid-template-columns:repeat(3,1fr) !important;}
  .grid-4{grid-template-columns:repeat(2,1fr) !important;}
  .grid-3{grid-template-columns:1fr !important;}
}
@media (max-width:980px){
  .sidebar{position:fixed; left:0; top:0; transform:translateX(-100%); transition:transform .2s ease; box-shadow:var(--shadow-pop);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-toggle{display:flex;}
  .sidebar-backdrop.open{display:block;}
  .main{padding:70px 16px 40px;}
  .form-grid-2{grid-template-columns:1fr;}
}
@media (max-width:640px){
  .hero-row{flex-direction:column;}
  .grid-5{grid-template-columns:repeat(2,1fr) !important;}
  .grid-4{grid-template-columns:1fr !important;}
  .hero-info-panel{background:#fff;}
  .hero-photo-wrap{opacity:.16;}
  .check-grid{grid-template-columns:1fr;}
}
</style>
</head>

  num:(n)=> new Intl.NumberFormat('es-PE').format(n),
  date:(d)=> new Intl.DateTimeFormat('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d),
  datetime:(d)=> new Intl.DateTimeFormat('es-PE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d),
  // Formatea un string 'YYYY-MM-DD' directo a 'DD/MM/AAAA' SIN pasar por Date() —
  // pasar por Date() interpreta la fecha en UTC y al mostrarla en huso horario local
  // (ej. Perú, UTC-5) puede recorrerse un día hacia atrás. Usar siempre esta función
  // para mostrar el campo "fecha" de un contenedor.
  fecha:(fechaStr)=>{
    if(!fechaStr) return '—';
    const [y,m,d] = String(fechaStr).slice(0,10).split('-');
    return `${d}/${m}/${y}`;
  },
};
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Porcentaje seguro: evita mostrar "NaN%" cuando todavía no hay datos (división entre 0).
function pctSeguro(parte, total, decimales=1){
  if(!total || !isFinite(parte/total)) return (0).toFixed(decimales);
  return (parte/total*100).toFixed(decimales);
}
function debounce(fn, ms=250){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function toast(msg, type='success'){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${icon(type==='success'?'check':'alert')}<span>${escapeHtml(msg)}</span>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
}

// ---- generación del conjunto completo de contenedores (datos de muestra / respaldo) ----
// Esta función YA NO SE EJECUTA SOLA (antes era un IIFE que corría automáticamente).
// Se conserva como respaldo: si algo falla al conectar con Supabase, puedes llamar
// seedDatosDeMuestra() manualmente desde la consola del navegador para volver a tener
// datos de ejemplo mientras solucionas la conexión.
function seedDatosDeMuestra(){
  DB.inspecciones = [];
  const contenedoresPrefijos = ['MSKU','HLXU','CMAU','MSCU','TCLU','ONEU','COSU'];
  const diasPorMes = {'2026-03':31,'2026-04':30,'2026-05':31,'2026-06':30,'2026-07':31,'2026-08':9}; // corte al 9-ago (hoy)
  // Fracción del mes más reciente que queda "programada" sin inspeccionar aún (trabajo pendiente).
  const FRACCION_PENDIENTE_MES_ACTUAL = 0.045;

  let seed = 42;
  function rnd(){ seed = (seed*1103515245+12345) % 2147483648; return seed/2147483648; }
  function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
  function weightedPick(items){
    const total = items.reduce((s,it)=>s+it.peso,0);
    let r = rnd()*total;
    for(const it of items){ r -= it.peso; if(r<=0) return it; }
    return items[items.length-1];
  }
  function weightedPickHallazgo(items){
    const total = items.reduce((s,it)=>s+it.weight,0);
    let r = rnd()*total;
    for(const it of items){ r -= it.weight; if(r<=0) return it; }
    return items[items.length-1];
  }
  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
  }

  const hallazgosObservado = DB.hallazgosCatalog.filter(h=> h.tipo==='observado' || h.tipo==='ambos');
  const hallazgosRechazado = DB.hallazgosCatalog.filter(h=> h.tipo==='rechazado' || h.tipo==='ambos');
  const inspectores = ['Luis Rodríguez','Ana Salazar','Marco Peña','Carla Ríos'];

  let id = 1;
  DB.campanas.forEach(camp=>{
    DB.periodos.forEach(periodo=>{
      const target = DB.seedTargets[`${camp.id}|${periodo.id}`];
      if(!target) return;
      const esMesActual = periodo.id === '2026-08';
      const pendientes = esMesActual ? Math.round(target.despachados * FRACCION_PENDIENTE_MES_ACTUAL) : 0;
      const despachadosReales = target.despachados - pendientes;

      const bucket = shuffle([
        ...Array(despachadosReales).fill('conforme'),
        ...Array(target.observados).fill('observado'),
        ...Array(target.rechazados).fill('rechazado'),
        ...Array(pendientes).fill(null),
      ]);

      bucket.forEach(resultado=>{
        const dia = String(1 + Math.floor(rnd()*diasPorMes[periodo.id])).padStart(2,'0');
        const esIncidente = resultado==='observado' || resultado==='rechazado';
        // Los incidentes se concentran en ciertos operadores/depósitos (según su "peso");
        // los contenedores conformes se reparten parejo entre todos.
        const operador = esIncidente ? weightedPick(DB.operadores) : pick(DB.operadores);
        const deposito = esIncidente ? weightedPick(DB.depositos) : pick(DB.depositos);
        const naviera = weightedPick(DB.navieras);
        let hallazgo = null;
        if(resultado==='observado') hallazgo = weightedPickHallazgo(hallazgosObservado).label;
        else if(resultado==='rechazado') hallazgo = weightedPickHallazgo(hallazgosRechazado).label;

        DB.inspecciones.push({
          id: id++,
          fecha: `${periodo.id}-${dia}`,
          contenedor: `${pick(contenedoresPrefijos)}${100000+Math.floor(rnd()*899999)}`.slice(0,11),
          campana: camp.id,
          sede: CAMPANA_SEDE[camp.id],
          operador: operador.nombre,
          deposito: deposito.nombre,
          naviera: naviera.nombre,
          booking: `BK-${10000+Math.floor(rnd()*89999)}`,
          resultado, // null = programado, pendiente de inspección
          hallazgo,
          descripcion: null,
          checklistExterna: [],
          checklistInterna: [],
          eir: null,
          inspector: resultado ? pick(inspectores) : null,
        });
      });
    });
  });
  DB.inspecciones.sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
}

// ---- Carga real de datos desde Supabase (reemplaza a los datos de muestra) ----
async function cargarDatosDesdeSupabase(){
  try{
    const [
      {data: contenedores, error: e1},
      {data: evidencias, error: e5}, {data: config, error: e6},
    ] = await Promise.all([
      supabase.from('contenedores').select('*').order('fecha', {ascending:false}),
      supabase.from('evidencias').select('*').order('fecha', {ascending:false}),
      supabase.from('configuracion').select('*').eq('id', 1).maybeSingle(),
    ]);
    const primerError = e1 || e5 || e6;
    if(primerError) throw primerError;

    DB.inspecciones = (contenedores||[]).map(c => ({
      id:c.id, contenedor:c.contenedor, fecha:c.fecha, campana:c.campana, sede:c.sede,
      operador:c.operador, deposito:c.deposito, naviera:c.naviera, booking:c.booking,
      resultado:c.resultado, hallazgo:c.hallazgo, descripcion:c.descripcion,
      checklistExterna:c.checklist_externa||[], checklistInterna:c.checklist_interna||[],
      eir:c.eir, inspector:c.inspector,
    }));
    // Nota: los operadores/depósitos/navieras YA NO se leen de tablas de catálogo aparte —
    // se derivan siempre de los contenedores reales (ver nombresUnicos()), así nunca
    // aparecen ejemplos que no hayas cargado tú mismo.
    if(evidencias) DB.evidencias = evidencias;
    if(config){
      DB.configuracion = {
        ...DB.configuracion,
        umbralAlerta: config.umbral_alerta,
        notifObservados: config.notif_observados,
        notifRechazados: config.notif_rechazados,
        notifReporteSemanal: config.notif_reporte_semanal,
      };
    }

    // Proyecciones: se cargan aparte (con su propio try/catch) para que la app siga
    // funcionando normalmente aunque todavía no hayas creado esta tabla en Supabase.
    try{
      const { data: proyecciones, error: eProy } = await supabase.from('proyecciones').select('*');
      if(!eProy && proyecciones){
        proyecciones.forEach(p=> DB.proyecciones[p.campana] = p.meta);
      }
    } catch(eProy){ console.warn('Tabla "proyecciones" no disponible todavía:', eProy); }
    console.log(`✅ Conectado a Supabase — ${DB.inspecciones.length} contenedores cargados.`);
  } catch(err){
    console.error('No se pudo conectar con Supabase:', err);
    mostrarErrorConexionSupabase(err);
    seedDatosDeMuestra(); // respaldo: la app sigue siendo utilizable con datos de muestra
  }
}

const NETWORK_DELAY = 220;

/* =====================================================================================
   AGREGACIÓN EN TIEMPO REAL — única fuente de verdad: DB.inspecciones
   ---------------------------------------------------------------------------------------
   Todo KPI, ranking y gráfico se calcula aquí filtrando/agrupando el conjunto real de
   contenedores. Así "Contenedores Programados" siempre coincide exactamente con la
   cantidad de filas que existen en la tabla de Inspecciones, y los rankings de
   Operadores/Depósitos/Navieras siempre coinciden con lo que se ve en sus propias vistas.
   ===================================================================================== */

// Filtra el conjunto de contenedores por campaña ('todas' = las 3) y periodo/vista.
function filtrarContenedores({campana='todas', periodo=null, vista='mensual'} = {}){
  let rows = DB.inspecciones;
  if(campana && campana!=='todas') rows = rows.filter(r=>r.campana===campana);
  if(periodo && periodo!=='todos'){
    if(vista==='anual') rows = periodo==='2026' ? rows.filter(r=>r.fecha.startsWith('2026')) : [];
    else rows = rows.filter(r=>r.fecha.startsWith(periodo));
  }
  return rows;
}

function computeKpis(rows){
  const conformes = rows.filter(r=>r.resultado==='conforme').length;
  const observados = rows.filter(r=>r.resultado==='observado').length;
  const rechazados = rows.filter(r=>r.resultado==='rechazado').length;
  const pendientes = rows.filter(r=>!r.resultado).length;
  // "Despachados" = todo lo que sí se despacha (conforme + observado). Un contenedor
  // observado igual se despacha; solo un rechazado se descuenta del despacho.
  const despachados = conformes + observados;
  return { programados: rows.length, despachados, conformes, observados, rechazados, pendientes };
}

function computeHallazgos(rows){
  const counts = {};
  rows.forEach(r=>{ if(r.hallazgo) counts[r.hallazgo] = (counts[r.hallazgo]||0)+1; });
  return DB.hallazgosCatalog
    .map(h=> ({ id:h.id, label:h.label, icon:h.icon, count: counts[h.label]||0 }))
    .sort((a,b)=> b.count-a.count);
}

// Nombres únicos que realmente aparecen en tus contenedores (sin catálogo de ejemplo aparte).
function nombresUnicos(campo){
  return [...new Set(DB.inspecciones.map(r=>r[campo]).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
}

// Ranking (top 3) por cantidad de incidentes (observado+rechazado), derivado 100% de
// los contenedores reales del conjunto filtrado — nunca de un catálogo de ejemplo.
function computeRanking(rows, campo, valueKey){
  const incidentes = rows.filter(r=> r.resultado==='observado' || r.resultado==='rechazado');
  const counts = {};
  incidentes.forEach(r=>{ counts[r[campo]] = (counts[r[campo]]||0)+1; });
  const total = incidentes.length || 1;
  return Object.entries(counts)
    .map(([nombre, valor])=> ({ nombre, [valueKey]: valor }))
    .sort((a,b)=> b[valueKey]-a[valueKey])
    .slice(0,3)
    .map(c=> ({...c, pct: Math.round(c[valueKey]/total*100)}));
}

// Estadísticas por operador/depósito/naviera (para sus vistas de tabla propias) —
// la lista de nombres sale de los contenedores reales, no de un catálogo aparte.
function computeOperadoresStats(){
  return nombresUnicos('operador').map(nombre=>{
    const rows = DB.inspecciones.filter(r=>r.operador===nombre && r.resultado);
    const inspecciones = rows.length;
    const observaciones = rows.filter(r=>r.resultado!=='conforme').length;
    return { nombre, inspecciones, observaciones, pct: inspecciones ? Math.round(observaciones/inspecciones*100) : 0 };
  }).sort((a,b)=> b.inspecciones-a.inspecciones);
}
function computeDepositosStats(){
  return nombresUnicos('deposito').map(nombre=>{
    const rows = DB.inspecciones.filter(r=>r.deposito===nombre && r.resultado);
    const incidencias = rows.filter(r=>r.resultado!=='conforme').length;
    const total = rows.length || 1;
    return { nombre, incidencias, pct: Math.round(incidencias/total*100) };
  }).sort((a,b)=> b.incidencias-a.incidencias);
}
function computeNavierasStats(){
  return nombresUnicos('naviera').map(nombre=>{
    const rows = DB.inspecciones.filter(r=>r.naviera===nombre && r.resultado);
    const contenedores = rows.length;
    const conformes = rows.filter(r=>r.resultado==='conforme').length;
    return { nombre, contenedores, cumplimiento: contenedores ? +(conformes/contenedores*100).toFixed(1) : 100 };
  }).sort((a,b)=> b.contenedores-a.contenedores);
}

// Gráfico "Despachado por mes": si hay un mes puntual seleccionado (vista mensual),
// representa solo ese mes; si no (vista anual, o "Todos los meses"), el histórico completo real.
// Muestra la cantidad DESPACHADA (conforme + observado) de cada mes, no el total programado.
function computeTendencia(campanaFiltro, periodoMensualSeleccionado){
  const campanasIds = campanaFiltro==='todas' ? DB.campanas.map(c=>c.id) : [campanaFiltro];
  const periodosReales = getPeriodosDisponibles().filter(p=>p.id!=='todos'); // excluir la opción meta "Todos los meses"
  const periodosAMostrar = (periodoMensualSeleccionado && periodoMensualSeleccionado!=='todos')
    ? periodosReales.filter(p=>p.id===periodoMensualSeleccionado)

        id:cid, nombre:camp.nombre, color:camp.color,

          r.campana===cid && r.fecha.startsWith(p.id) && (r.resultado==='conforme'||r.resultado==='observado')

    }),

// Iconos/colores para representar cada tipo de hallazgo en "Imagen representativa".
// Meses realmente disponibles: los que ya tienen contenedores registrados + el mes actual
// (siempre visible, aunque todavía no haya datos, para poder empezar a cargar ahí).
const NOMBRES_MES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function periodoIdANombre(id){
  const [y,m] = id.split('-');
  return `${NOMBRES_MES[parseInt(m,10)-1]} ${y}`;
}
function getPeriodosDisponibles(){
  const set = new Set(DB.inspecciones.map(r=>r.fecha.slice(0,7)));
  const hoy = new Date();
  set.add(`${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`);
  const meses = [...set].sort().map(id=>({id, nombre: periodoIdANombre(id)}));
  return [{id:'todos', nombre:'Todos los meses'}, ...meses];
}

// Actividad de campaña: SIEMPRE calculada desde el primer contenedor real de esa campaña
// hasta hoy (no depende del filtro de Periodo — cambia solo cuando cambias de Campaña).
function computeActividadCampana(rows){
  if(!rows.length){
    return { diasTranscurridos:0, fechaInicioTexto:'Sin actividad aún', promedioDiario:0, avanceInspeccionPct:0, hayDatos:false };
  }
  const fechaInicio = new Date(rows.map(r=>r.fecha).sort()[0]+'T00:00:00');
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const diasTranscurridos = Math.max(1, Math.round((hoy-fechaInicio)/86400000)+1);
  const inspeccionados = rows.filter(r=>r.resultado).length;
  return {
    diasTranscurridos,
    fechaInicioTexto: fmt.date(fechaInicio),
    promedioDiario: +(rows.length/diasTranscurridos).toFixed(1),
    avanceInspeccionPct: Math.round(inspeccionados/rows.length*100),
    hayDatos:true,
  };
}

// Extrae el mensaje real de error de una Edge Function.
// Cuando la función responde con un código de error (401/403/500), la librería de
// Supabase deja el cuerpo dentro de error.context (una respuesta HTTP), no en data —
// sin esto solo se vería el mensaje genérico "non-2xx status code".
async function lanzarSiErrorEdgeFunction({ data, error }){
  if(!error && !(data && data.error)) return;
  let mensaje = (data && data.error) || (error && error.message) || 'Error desconocido';
  try{
    if(error && error.context && typeof error.context.json === 'function'){
      const cuerpo = await error.context.json();
      if(cuerpo && cuerpo.error) mensaje = cuerpo.error;
    }
  }catch(_){ /* si el cuerpo no es JSON, se conserva el mensaje anterior */ }
  console.error('Edge Function gestionar-usuario:', mensaje);
  throw new Error(mensaje);
}

  // Sede se deriva de la Campaña seleccionada (relación fija Campaña → Sede). Si es "Todas", se muestran ambas.
  function refreshSedeSelect(){
    const campanaId = document.getElementById('filCampana').value;
    if(campanaId === 'todas'){
      document.getElementById('filSede').innerHTML = `<option value="todas" selected>Todas (Piscu + Ica)</option>`;
      return;
    }
    const sedeId = CAMPANA_SEDE[campanaId];
    const sedeNombre = DB.sedes.find(s=>s.id===sedeId)?.nombre || sedeId;
    document.getElementById('filSede').innerHTML = `<option value="${sedeId}" selected>${sedeNombre}</option>`;
  }
  refreshSedeSelect();

  // Periodo cambia entre lista de meses / lista de años según el toggle Mensual · Anual.
  function refreshPeriodoOptions(){
    const sel = document.getElementById('filPeriodo');
    const lista = State.filtros.vista === 'anual' ? DB.periodosAnuales : getPeriodosDisponibles();
    sel.innerHTML = lista.map(p=>`<option value="${p.id}" ${p.id===State.filtros.periodo?'selected':''}>${p.nombre}</option>`).join('');
  }

  document.getElementById('filCampana').addEventListener('change', async ()=>{
    refreshSedeSelect();
    State.filtros.campana = document.getElementById('filCampana').value;
    await loadDashboardData();
  });
  document.getElementById('filPeriodo').addEventListener('change', async ()=>{
    State.filtros.periodo = document.getElementById('filPeriodo').value;
    await loadDashboardData();
  });
  document.getElementById('vistaToggle').querySelectorAll('button').forEach(btn=>{

      if(vista === State.filtros.vista) return;
      State.filtros.vista = vista;
      document.getElementById('vistaToggle').querySelectorAll('button').forEach(b=>b.classList.toggle('active', b===btn));
      if(vista === 'anual'){
        State.filtros.periodo = '2026';
      } else {
        const disponibles = getPeriodosDisponibles();
        State.filtros.periodo = disponibles[disponibles.length-1].id; // el más reciente con datos (o el mes actual)
      }
      refreshPeriodoOptions();
      await loadDashboardData();
    });
  });

  // Notificaciones: últimas inspecciones con hallazgo real (observado / rechazado — no pendientes)
  const btnNotif = document.getElementById('btnNotif');
  const notifDropdown = document.getElementById('notifDropdown');
  const notifBadge = document.getElementById('notifBadge');
  const todasLasAlertas = DB.inspecciones.filter(r=> r.resultado==='observado' || r.resultado==='rechazado');
  if(todasLasAlertas.length){
    notifBadge.style.display = 'flex';
    notifBadge.textContent = todasLasAlertas.length > 9 ? '9+' : todasLasAlertas.length;
  }
  btnNotif.addEventListener('click', (e)=>{
    e.stopPropagation();
    State.notifOpen = !State.notifOpen;
    if(State.notifOpen){
      const alertas = todasLasAlertas.slice(0,4);
      notifDropdown.innerHTML = `
        <div class="notif-dropdown-head">Alertas recientes</div>
        ${alertas.length ? alertas.map(a=>`
          <div class="notif-item">
            <span class="dot-status" style="background:${a.resultado==='rechazado'?'var(--danger)':'var(--warning)'};"></span>
            <div><b>${escapeHtml(a.contenedor)} — ${a.resultado==='rechazado'?'Rechazado':'Observado'}</b><span>${escapeHtml(a.hallazgo||'Sin detalle')} · ${fmt.fecha(a.fecha)}</span></div>
          </div>
        `).join('') : `<div class="notif-empty">Sin alertas recientes</div>`}
      `;
    }
    notifDropdown.style.display = State.notifOpen ? 'block' : 'none';
  });
  document.addEventListener('click', ()=>{ if(State.notifOpen){ State.notifOpen=false; notifDropdown.style.display='none'; } }, {once:true});
  document.getElementById('btnAvatar').addEventListener('click', ()=> location.hash = '#/configuracion');

  await loadDashboardData();
}

function drawTendencia(canvasId, tendencia){
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  if(State.charts[canvasId]) State.charts[canvasId].destroy();
  State.charts[canvasId] = new Chart(ctx, {
    type:'bar',
    data:{
      labels:tendencia.labels,
      datasets: tendencia.series.map(s=>({label:s.nombre, data:s.data, backgroundColor:s.color, borderRadius:5, maxBarThickness: tendencia.series.length>1?20:34})),
    },
    options:{
      responsive:true,
      plugins:{legend:{display:false}, tooltip:{backgroundColor:'#1c1f36', padding:10, cornerRadius:8}},
      scales:{
        y:{grid:{color:'#f0f0f7'}, ticks:{color:'#8a8fa3', font:{size:11}}},
        x:{grid:{display:false}, ticks:{color:'#8a8fa3', font:{size:11}}}
      }
    }
  });
}

function drawDonut(canvasId, donutData, mini){
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  if(State.charts[canvasId]) State.charts[canvasId].destroy();
  State.charts[canvasId] = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels:donutData.map(d=>d.label),
      datasets:[{ data:donutData.map(d=>d.value), backgroundColor:donutData.map(d=>d.color), borderWidth:0, hoverOffset:4 }]
    },
    options:{
      responsive:true, maintainAspectRatio:true,
      cutout: mini ? '68%' : '72%',
      plugins:{ legend:{display:false}, tooltip:{backgroundColor:'#1c1f36', padding:10, cornerRadius:8} }
    }
  });
}

// Medidor tipo gauge (semicírculo): Despachados vs. Contenedores Proyectados.
function drawGauge(canvasId, valor, total){
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  if(State.charts[canvasId]) State.charts[canvasId].destroy();
  const v = Math.min(valor, total || 0);
  const restante = Math.max(0, (total||0) - v);
  const sinMeta = !total;
  State.charts[canvasId] = new Chart(ctx, {
    type:'doughnut',
    data:{
      datasets:[{
        data: sinMeta ? [1] : [v, restante],
        backgroundColor: sinMeta ? ['#eceef4'] : [(v>=total?'#1fb980':'#6c5ce7'), '#eceef4'],
        borderWidth:0,
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:true,
      rotation:-90, circumference:180, cutout:'72%',
      plugins:{ legend:{display:false}, tooltip:{enabled:false} }
    }
  });
}

// Modal para fijar los "contenedores proyectados" de una campaña (o de las 3, si está en "Todas").
function openProyeccionModal(campanaFiltro, onSaved){
  const campanas = campanaFiltro==='todas' ? DB.campanas : [DB.campanas.find(c=>c.id===campanaFiltro)];
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" style="max-width:400px;">
        <div class="modal-head"><h3>Contenedores proyectados</h3><button class="modal-close" id="modalClose">${icon('x')}</button></div>
        <div class="modal-body">
          <p style="font-size:12.5px; color:var(--text-muted); margin-bottom:14px;">Define la meta de contenedores a despachar. El medidor va a mostrar el avance real contra esta cifra.</p>
          ${campanas.map(c=>`
            <div class="form-row"><label>${c.nombre}</label><input type="number" min="0" step="1" id="proy_${c.id}" value="${DB.proyecciones[c.id]||0}" /></div>
          `).join('')}
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="modalCancel">Cancelar</button>
          <button class="btn btn-primary" id="modalGuardarProy">${icon('check')} Guardar</button>
        </div>
      </div>
    </div>
  `;
  const close = ()=> modalRoot.innerHTML = '';
  document.getElementById('modalClose').addEventListener('click', close);
  document.getElementById('modalCancel').addEventListener('click', close);
  document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') close(); });
  document.getElementById('modalGuardarProy').addEventListener('click', async ()=>{
    try{
      for(const c of campanas){
        const val = Math.max(0, parseInt(document.getElementById('proy_'+c.id).value, 10) || 0);
        await DataService.setProyeccion(c.id, val);
      }
      close();
      toast('Proyección actualizada');
      onSaved();
    } catch(err){ /* el toast de error ya lo muestra setProyeccion */ }
  });
}

        <div class="search-box">${icon('search')}<input type="text" id="searchInsp" placeholder="Buscar contenedor, operador, depósito, naviera..." /></div>
        <div class="select-wrap"><select id="filResultado">
          <option value="">Todos los estados</option>
          <option value="pendiente">Pendiente de inspección</option>
          <option value="conforme">Conforme</option>
          <option value="observado">Observado</option>
          <option value="rechazado">Rechazado</option>
        </select></div>
        <div class="select-wrap"><select id="filCampanaTabla">
          <option value="">Todas las campañas</option>
          ${DB.campanas.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}
        </select></div>
        <div class="select-wrap"><select id="filSedeTabla">
          <option value="">Todas las sedes</option>
          ${DB.sedes.map(s=>`<option value="${s.id}">${s.nombre}</option>`).join('')}
        </select></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Contenedor</th><th>Fecha</th><th>Campaña</th><th>Sede</th><th>Operador</th><th>Depósito</th><th>Naviera</th><th>Booking</th><th>Estado</th><th>Inspector</th><th>Acciones</th>
          </tr></thead>
          <tbody id="inspTableBody"></tbody>
        </table>
      </div>
      <div id="inspEmpty"></div>
      <div style="margin-top:12px; font-size:12px; color:var(--text-muted);" id="inspCount"></div>
    </div>
  `;

  async function refresh(){
    const rows = await DataService.getInspecciones({
      search: document.getElementById('searchInsp').value,
      resultado: document.getElementById('filResultado').value,
      campana: document.getElementById('filCampanaTabla').value,
      sede: document.getElementById('filSedeTabla').value,
    });
    const tbody = document.getElementById('inspTableBody');
    const pillFor = (r)=> r==='conforme' ? `<span class="pill pill-green">Conforme</span>`
                        : r==='observado' ? `<span class="pill pill-amber">Observado</span>`
                        : r==='rechazado' ? `<span class="pill pill-red">Rechazado</span>`
                        : `<span class="pill pill-gray">Pendiente</span>`;
    const LIMITE = 150;
    tbody.innerHTML = rows.slice(0,LIMITE).map(r=>`
      <tr>
        <td class="cell-strong">${escapeHtml(r.contenedor)}</td>
        <td>${fmt.fecha(r.fecha)}</td>
        <td>${escapeHtml(DB.campanas.find(c=>c.id===r.campana)?.nombre||r.campana)}</td>
        <td>${escapeHtml(DB.sedes.find(s=>s.id===r.sede)?.nombre||r.sede)}</td>
        <td>${escapeHtml(r.operador)}</td>
        <td>${escapeHtml(r.deposito)}</td>
        <td>${escapeHtml(r.naviera)}</td>
        <td>${escapeHtml(r.booking||'—')}</td>
        <td>${pillFor(r.resultado)}</td>
        <td>${escapeHtml(r.inspector || '—')}</td>
        <td>
          <div style="display:flex; gap:6px;">
            <button class="icon-action-btn" data-view="${r.id}" title="Ver detalle">${icon('eye')}</button>
            ${r.resultado
              ? `<button class="icon-action-btn" data-edit="${r.id}" title="Editar">${icon('edit')}</button>`
              : `<button class="icon-action-btn" data-edit="${r.id}" title="Inspeccionar" style="background:var(--primary-light); color:var(--primary); border-color:var(--primary-light);">${icon('clipboardCheck')}</button>`
            }
            ${Sesion.puedeEliminar() ? `<button class="icon-action-btn danger" data-delete="${r.id}" title="Eliminar">${icon('trash')}</button>` : ''}
          </div>
        </td>
      </tr>
    `).join('');
    document.getElementById('inspEmpty').innerHTML = rows.length ? '' : `
      <div class="empty-state">${icon('clipboard')}<h4>Sin resultados</h4><p>No hay contenedores que coincidan con los filtros aplicados.</p></div>`;
    document.getElementById('inspCount').textContent = `Mostrando ${Math.min(rows.length,LIMITE)} de ${fmt.num(rows.length)} contenedores — usa la búsqueda o los filtros para acotar`;

    tbody.querySelectorAll('[data-view]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const row = DB.inspecciones.find(i=>i.id===+btn.dataset.view);
        if(row) openDetalleInspeccionModal(row);
      });
    });
    tbody.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        State.editingInspeccionId = +btn.dataset.edit;
        location.hash = '#/inspeccion-nueva';
      });
    });
    tbody.querySelectorAll('[data-delete]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = +btn.dataset.delete;
        const row = DB.inspecciones.find(i=>i.id===id);
        openConfirmModal({
          title:'Eliminar contenedor',
          message: `¿Seguro que deseas eliminar el registro del contenedor ${row?.contenedor||''}? Esta acción no se puede deshacer.`,
          confirmLabel:'Eliminar',
        }, async ()=>{
          await DataService.deleteInspeccion(id);
          toast('Registro eliminado');
          refresh();
        });
      });
    });
  }

  document.getElementById('searchInsp').addEventListener('input', debounce(refresh, 200));
  ['filResultado','filCampanaTabla','filSedeTabla'].forEach(id=>document.getElementById(id).addEventListener('change', refresh));
  document.getElementById('btnNuevaInspeccion').addEventListener('click', ()=>{
    State.editingInspeccionId = null;
    location.hash = '#/inspeccion-nueva';
  });
  document.getElementById('btnProgramar').addEventListener('click', ()=> openProgramarModal(refresh));

  await refresh();
}

/* =====================================================================================
   PROGRAMACIÓN DE CONTENEDORES
   ---------------------------------------------------------------------------------------
   Permite cargar por adelantado los contenedores que llegarán (con naviera, booking,
   operador y depósito ya definidos). Quedan como "Pendiente de inspección", de modo que
   el inspector en campo solo tenga que abrir cada uno y registrar la inspección.
   ===================================================================================== */
function openProgramarModal(onSaved){
  let filas = [{contenedor:'', naviera:'', booking:'', operador:'', deposito:''}];
  const modalRoot = document.getElementById('modalRoot');

  function pintar(){
    modalRoot.innerHTML = `
      <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal" style="max-width:900px;">
          <div class="modal-head">
            <h3>Programar contenedores</h3>
            <button class="modal-close" id="modalClose">${icon('x')}</button>
          </div>
          <div class="modal-body">
            <p style="font-size:12.5px; color:var(--text-muted); margin-bottom:14px;">
              Carga los contenedores que llegarán. Quedarán como <b>Pendiente de inspección</b> para que el inspector solo tenga que registrar el resultado en campo.
            </p>

            <div class="form-grid-2" style="grid-template-columns:1fr 1fr;">
              <div class="form-row"><label>Campaña</label>
                <select id="pgCampana" class="select-inline">${DB.campanas.map(c=>`<option value="${c.id}">${escapeHtml(c.nombre)}</option>`).join('')}</select>
              </div>
              <div class="form-row"><label>Fecha programada</label>
                <input type="date" id="pgFecha" value="${new Date().toISOString().slice(0,10)}" />
              </div>
            </div>

            <div style="display:flex; align-items:center; justify-content:space-between; margin:6px 0 8px;">
              <b style="font-size:13px; color:var(--text-heading);">Contenedores (${filas.length})</b>
              <button class="btn btn-ghost" id="pgPegar" style="padding:6px 12px; font-size:12px;">${icon('clipboard')} Pegar desde Excel</button>
            </div>

            <div class="table-wrap" style="max-height:320px; overflow-y:auto;">
              <table>
                <thead><tr>
                  <th style="min-width:150px;">N.° contenedor</th>
                  <th style="min-width:140px;">Naviera</th>
                  <th style="min-width:120px;">Booking</th>
                  <th style="min-width:160px;">Operador logístico</th>
                  <th style="min-width:140px;">Depósito</th>
                  <th></th>
                </tr></thead>
                <tbody id="pgBody">
                  ${filas.map((f,i)=>`
                    <tr>
                      <td><input data-f="${i}" data-c="contenedor" value="${escapeHtml(f.contenedor)}" placeholder="MSCU1234567" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;text-transform:uppercase;" /></td>
                      <td><input data-f="${i}" data-c="naviera" value="${escapeHtml(f.naviera)}" list="dlPgNav" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;" /></td>
                      <td><input data-f="${i}" data-c="booking" value="${escapeHtml(f.booking)}" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;" /></td>
                      <td><input data-f="${i}" data-c="operador" value="${escapeHtml(f.operador)}" list="dlPgOp" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;" /></td>
                      <td><input data-f="${i}" data-c="deposito" value="${escapeHtml(f.deposito)}" list="dlPgDep" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;" /></td>
                      <td>${filas.length>1?`<button class="icon-action-btn danger" data-del="${i}" title="Quitar fila">${icon('trash')}</button>`:''}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
              <datalist id="dlPgNav">${nombresUnicos('naviera').map(n=>`<option value="${escapeHtml(n)}">`).join('')}</datalist>
              <datalist id="dlPgOp">${nombresUnicos('operador').map(n=>`<option value="${escapeHtml(n)}">`).join('')}</datalist>
              <datalist id="dlPgDep">${nombresUnicos('deposito').map(n=>`<option value="${escapeHtml(n)}">`).join('')}</datalist>
            </div>

            <button class="btn btn-ghost" id="pgAgregar" style="margin-top:10px;">${icon('plus')} Agregar fila</button>
          </div>
          <div class="modal-foot">
            <button class="btn btn-ghost" id="modalCancel">Cancelar</button>
            <button class="btn btn-primary" id="pgGuardar">${icon('check')} Programar</button>
          </div>
        </div>
      </div>
    `;
    enlazar();
  }

  function leerCampos(){
    modalRoot.querySelectorAll('[data-f]').forEach(inp=>{
      filas[+inp.dataset.f][inp.dataset.c] = inp.value;
    });
  }

  function enlazar(){
    const close = ()=> modalRoot.innerHTML = '';
    document.getElementById('modalClose').addEventListener('click', close);
    document.getElementById('modalCancel').addEventListener('click', close);
    document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') close(); });

    modalRoot.querySelectorAll('[data-f]').forEach(inp=>{
      inp.addEventListener('input', ()=>{ filas[+inp.dataset.f][inp.dataset.c] = inp.value; });
    });
    modalRoot.querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener('click', ()=>{ leerCampos(); filas.splice(+b.dataset.del,1); pintar(); });
    });
    document.getElementById('pgAgregar').addEventListener('click', ()=>{
      leerCampos();
      filas.push({contenedor:'', naviera:'', booking:'', operador:'', deposito:''});
      pintar();
    });

    // Pegar desde Excel: convierte filas separadas por tabulaciones en filas de la tabla
    document.getElementById('pgPegar').addEventListener('click', ()=>{
      const texto = prompt('Copia las filas desde Excel (columnas: Contenedor, Naviera, Booking, Operador, Depósito) y pégalas aquí:');
      if(!texto) return;
      leerCampos();
      const nuevas = texto.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(linea=>{
        const c = linea.split('\t');
        return {
          contenedor:(c[0]||'').trim(), naviera:(c[1]||'').trim(), booking:(c[2]||'').trim(),
          operador:(c[3]||'').trim(), deposito:(c[4]||'').trim(),
        };
      });
      if(!nuevas.length){ toast('No se detectaron filas', 'alert'); return; }
      filas = filas.filter(f=>f.contenedor.trim()).concat(nuevas);
      pintar();
      toast(`${nuevas.length} fila(s) agregada(s)`);
    });

    document.getElementById('pgGuardar').addEventListener('click', async ()=>{
      leerCampos();
      const campana = document.getElementById('pgCampana').value;
      const fecha = document.getElementById('pgFecha').value;
      const validas = filas.filter(f=>f.contenedor.trim());
      if(!validas.length){ toast('Ingresa al menos un N.° de contenedor', 'alert'); return; }

      const btn = document.getElementById('pgGuardar');
      btn.disabled = true; btn.textContent = 'Programando...';
      let ok = 0;
      try{
        for(const f of validas){
          await DataService.createInspeccion({
            contenedor: f.contenedor.trim().toUpperCase(),
            fecha, campana, sede: CAMPANA_SEDE[campana],
            naviera: f.naviera.trim(), booking: f.booking.trim(),
            operador: f.operador.trim(), deposito: f.deposito.trim(),
            resultado: null,           // pendiente de inspección
            hallazgo: null, descripcion: null,
            checklistExterna: [], checklistInterna: [],
            eir: null, inspector: null,
          });
          ok++;
        }
        modalRoot.innerHTML = '';
        toast(`${ok} contenedor(es) programado(s)`);
        onSaved();
      } catch(err){
        btn.disabled = false;
        btn.innerHTML = `${icon('check')} Programar`;
        if(ok) toast(`Se programaron ${ok} antes del error`, 'alert');
      }
    });
  }

  pintar();
}

  {id:'lateral_der', label:'Lateral derecho'},
  {id:'techo_ext', label:'Techo exterior'},

  {id:'luz', label:'Luz'},

async function renderNuevaInspeccion(root){

  root.innerHTML = `
    <div class="view-header">
      <div><h2>${esPendiente ? 'Inspeccionar contenedor' : editRecord ? 'Editar inspección' : 'Nueva inspección'}</h2><p>Registro interno y externo del contenedor</p></div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-ghost" id="btnCancelarInsp">Cancelar</button>
        <button class="btn btn-primary" id="btnGuardarInsp">${icon('check')} ${esPendiente ? 'Completar inspección' : editRecord ? 'Guardar cambios' : 'Guardar inspección'}</button>
      </div>
    </div>

    <div class="card card-pad" style="margin-bottom:18px;">
      <div class="form-grid-2" style="grid-template-columns:repeat(3,1fr);">
        <div class="form-row"><label>Campaña</label>
          <select id="niCampana" class="select-inline">${DB.campanas.map(c=>`<option value="${c.id}" ${editRecord&&editRecord.campana===c.id?'selected':''}>${c.nombre}</option>`).join('')}</select>
        </div>
        <div class="form-row"><label>Sede</label>
          <select id="niSede" class="select-inline" disabled></select>
        </div>
        <div class="form-row"><label>Fecha</label><input type="date" id="niFecha" value="${editRecord?editRecord.fecha:'2026-08-10'}" /></div>

        <div class="form-row"><label>N.° contenedor</label><input type="text" id="niContenedor" placeholder="MSCU1234567" value="${editRecord?escapeHtml(editRecord.contenedor):''}" /></div>
        <div class="form-row"><label>Naviera</label><select id="niNaviera" class="select-inline"></select></div>
        <div class="form-row"><label>Booking</label><input type="text" id="niBooking" placeholder="BK-45892" value="${editRecord&&editRecord.booking?escapeHtml(editRecord.booking):''}" /></div>

        <div class="form-row"><label>Operador logístico</label><select id="niOperador" class="select-inline"></select></div>
        <div class="form-row"><label>Depósito temporal / vacío</label><select id="niDeposito" class="select-inline"></select></div>
        <div class="form-row"><label>Inspector</label><input type="text" id="niInspector" placeholder="Nombre del inspector" value="${editRecord&&editRecord.inspector?escapeHtml(editRecord.inspector):'Luis Rodríguez'}" /></div>
      </div>
    </div>

    <div class="grid" style="grid-template-columns:1fr 1fr; margin-bottom:18px;">
      <div class="card card-pad">
        <div class="card-title-row"><h3>Inspección externa</h3></div>
        <div class="check-grid" id="niExterna">
          ${CHECK_EXTERNA.map(c=>`
            <label class="check-item" data-id="${c.id}"><input type="checkbox" value="${c.id}" ${editRecord?.checklistExterna?.includes(c.id)?'checked':''} />${c.label}</label>
          `).join('')}
        </div>
        <div class="diagram-box">
          <svg width="220" height="110" viewBox="0 0 220 110">
            <rect x="4" y="4" width="212" height="102" rx="6" fill="none" stroke="#b9bedd" stroke-width="1.5" stroke-dasharray="4 3"/>
            ${[1,2,3,4,5,6,7].map(i=>`<line x1="${4+i*26.5}" y1="8" x2="${4+i*26.5}" y2="102" stroke="#d7dae9" stroke-width="1"/>`).join('')}
          </svg>
        </div>
        <div class="diagram-caption">TECHO / PARED FRONTAL / LATERALES</div>
      </div>

      <div class="card card-pad">
        <div class="card-title-row"><h3>Inspección interna</h3></div>
        <div class="check-grid" id="niInterna">
          ${CHECK_INTERNA.map(c=>`
            <label class="check-item" data-id="${c.id}"><input type="checkbox" value="${c.id}" ${editRecord?.checklistInterna?.includes(c.id)?'checked':''} />${c.label}</label>
          `).join('')}
        </div>
        <div class="form-row" style="margin-top:18px;">
          <label>Resultado</label>
          <select id="niResultado" class="select-inline">
            <option value="" disabled ${!editRecord?.resultado?'selected':''}>Selecciona un resultado...</option>
            <option value="conforme" ${editRecord&&editRecord.resultado==='conforme'?'selected':''}>Conforme</option>
            <option value="observado" ${editRecord&&editRecord.resultado==='observado'?'selected':''}>Observado</option>

        <input type="file" id="niFileEir" style="display:none;" />

      <div class="attach-row" id="niAttachRow"></div>
    </div>
  `;
  if(editRecord?.eir){
    NuevaInspeccionState.eir = editRecord.eir.startsWith('data:')
      ? { nombre:'Documento EIR', dataUrl: editRecord.eir }
      : { nombre: editRecord.eir, dataUrl: null }; // registro antiguo: solo se guardó el nombre, sin archivo
  }

  // Checklist visual (marca la tarjeta al tildar)
  root.querySelectorAll('.check-item').forEach(item=>{

    if(cb.checked) item.classList.add('checked');
    cb.addEventListener('change', ()=> item.classList.toggle('checked', cb.checked));
